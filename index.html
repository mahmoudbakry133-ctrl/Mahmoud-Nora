      `);

      document.getElementById('closeDebtModal').addEventListener('click', closeModal);
      document.getElementById('btnAddDebtItem').addEventListener('click', () => {
        const name = document.getElementById('newDebtName').value.trim();
        const total = Number(document.getElementById('newDebtTotal').value);
        if (!name || !total || total <= 0) { showToast('أدخل اسم الدين وإجمالي المبلغ', 'error'); return; }
        state.debt.items.unshift({
          id: 'debt_' + Date.now(),
          name,
          type: document.getElementById('newDebtType').value,
          total,
          paid: 0,
          dueDate: document.getElementById('newDebtDue').value || '',
          monthlyInstallment: Number(document.getElementById('newDebtInst').value) || 0,
          userId: state.activeUserId,
          updatedAt: new Date().toISOString()
        });
        logActivity(`أضاف دين "${name}" بمبلغ ${fmt(total)} ج`);
        saveState();
        renderAll();
        openDebtModal();
        showToast('تمت إضافة الدين بنجاح');
      });

      document.querySelectorAll('[data-debt-to-budget]').forEach(btn => {
        btn.addEventListener('click', () => {
          const d = state.debt.items.find(x => x.id === btn.dataset.debtToBudget);
          if (!d) return;
          const month = getCurrentMonth();
          const rem = Math.max(0, (Number(d.total) || 0) - (Number(d.paid) || 0));
          const allocAmt = d.monthlyInstallment > 0 ? Math.min(rem, d.monthlyInstallment) : rem;
          const budName = `سداد: ${d.name}`;
          const existing = month.budgets.find(b => b.name === budName);
          if (existing) {
            existing.planned = allocAmt;
            existing.updatedAt = new Date().toISOString();
          } else {
            month.budgets.unshift({
              id: 'b_debt_' + Date.now(),
              name: budName,
              type: 'fixed',
              planned: allocAmt,
              catId: 'bills_home',
              updatedAt: new Date().toISOString()
            });
          }
          logActivity(`أضاف "${budName}" (${fmt(allocAmt)} ج) إلى تقسيم ${month.label}`);
          saveState();
          closeModal();
          activeTab = 'budget';
          renderAll();
          showToast(`تمت إضافة "${budName}" لتقسيم الشهر وخصمه من المتاح`);
        });
      });

      document.querySelectorAll('[data-debt-pay]').forEach(btn => {
        btn.addEventListener('click', () => {
          const d = state.debt.items.find(x => x.id === btn.dataset.debtPay);
          if (!d) return;
          const rem = Math.max(0, (Number(d.total) || 0) - (Number(d.paid) || 0));
          showModal(`
            <div class="flex items-center justify-between mb-3">
              <h3 class="text-base font-extrabold text-slate-900 dark:text-white">سداد دفعة من "${escapeHtml(d.name)}"</h3>
              <button type="button" id="closePaySub" class="p-1.5 rounded-full bg-slate-100 dark:bg-slate-700"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="space-y-3">
              <input id="subPayAmt" type="number" inputmode="decimal" value="${d.monthlyInstallment || rem}" class="w-full px-3 py-2.5 text-xl font-extrabold text-emerald-700 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl" />
              <label class="flex items-center gap-2 text-xs font-bold text-slate-700 dark:text-slate-300">
                <input id="subPayLogExp" type="checkbox" checked class="w-4 h-4 accent-brand-700" />
                <span>تسجيل الدفعة أيضاً في مصروفات الشهر الحالي</span>
              </label>
              <button type="button" id="btnDoSubPay" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">تأكيد السداد ✓</button>
            </div>
          `);
          document.getElementById('closePaySub').addEventListener('click', openDebtModal);
          document.getElementById('btnDoSubPay').addEventListener('click', () => {
            const p = Number(document.getElementById('subPayAmt').value);
            if (!p || p <= 0) { showToast('أدخل مبلغاً صحيحاً', 'error'); return; }
            d.paid = (Number(d.paid) || 0) + p;
            d.updatedAt = new Date().toISOString();
            if (document.getElementById('subPayLogExp').checked) {
              const month = getCurrentMonth();
              const todayStr = new Date().toISOString().slice(0, 10);
              const bud = month.budgets.find(b => b.name === `سداد: ${d.name}`);
              const nowIso = new Date().toISOString();
              month.expenses.unshift({
                id: 'exp_debt_' + Date.now(),
                date: month.key === todayStr.slice(0, 7) ? todayStr : (month.key + '-01'),
                time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
                amount: p, catId: 'bills_home', subName: 'سداد دين', itemName: `سداد: ${d.name}`,
                budgetId: bud ? bud.id : DIRECT_SALARY_ID, note: 'دفعة سداد دين', userId: state.activeUserId, createdAt: nowIso, updatedAt: nowIso
              });
            }
            logActivity(`سدد ${fmt(p)} ج من دين "${d.name}"`);
            saveState();
            renderAll();
            openDebtModal();
            showToast(`تم سداد ${fmt(p)} ج`);
          });
        });
      });

      document.querySelectorAll('[data-debt-del]').forEach(btn => {
        btn.addEventListener('click', () => {
          const did = btn.dataset.debtDel;
          state.debt.items = state.debt.items.filter(x => x.id !== did);
          state.deletedIds.push(did);
          saveState();
          renderAll();
          openDebtModal();
        });
      });
    }

    // --- ADD / EDIT EXPENSE MODAL (With "أخرى" box + Direct Salary option) ---
    function openExpenseModal(existingExp = null, preBudgetId = '', preCatId = '') {
      const month = getCurrentMonth();
      const usr = getActiveUser();
      const todayStr = new Date().toISOString().slice(0, 10);
      const defaultDate = existingExp ? existingExp.date : (month.key === todayStr.slice(0, 7) ? todayStr : (month.key + '-01'));
      const flatCatalog = getAllCatalogItemsFlat();

      let selectedCatId = existingExp ? existingExp.catId : (preCatId || 'poultry_meat');
      let selectedSubName = existingExp ? existingExp.subName : getCatById(selectedCatId).subcategories[0].name;
      let selectedItemName = existingExp ? existingExp.itemName : '';
      let isCustomOther = existingExp ? (selectedCatId === 'other' || !flatCatalog.some(f => f.itemName === existingExp.itemName)) : false;

      function findBudgetIdForCat(cid) {
        if (preBudgetId) return preBudgetId;
        const c = getCatById(cid);
        const match = (month.budgets || []).find(b => b.name === c.defaultBudgetName) || (month.budgets || []).find(b => b.catId === cid);
        return match ? match.id : DIRECT_SALARY_ID;
      }

      let selectedBudgetId = existingExp ? (existingExp.budgetId || DIRECT_SALARY_ID) : findBudgetIdForCat(selectedCatId);

      showModal(`
        <div class="flex items-center justify-between mb-3">
          <div>
            <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${existingExp ? 'تعديل مصروف' : 'تسجيل مصروف جديد'}</h3>
            <div class="text-[11px] font-bold" style="color:${usr.color}">بواسطة: ${escapeHtml(usr.name)} • ${escapeHtml(month.label)}</div>
          </div>
          <button type="button" id="closeExpModal" class="p-1.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>

        ${!existingExp ? `
          <div class="mb-2.5">
            <div class="text-[10px] font-bold text-slate-400 mb-1">اختصارات سريعة متكررة:</div>
            <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
              ${QUICK_FAVORITES.map((f, i) => `<button type="button" data-qfav="${i}" class="qfav-btn shrink-0 px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-700 hover:bg-brand-100 text-[11px] font-bold text-slate-700 dark:text-slate-200">${f.label}</button>`).join('')}
            </div>
          </div>
        ` : ''}

        <!-- Instant Smart Search -->
        <div class="relative mb-3">
          <i data-lucide="search" class="w-4 h-4 text-brand-600 absolute right-3 top-3"></i>
          <input id="smartItemSearch" type="text" placeholder="ابحث في 400+ صنف: بانيه، توكتوك، فول، مولفيكس..." class="w-full pr-9 pl-3 py-2.5 text-xs bg-brand-50/70 dark:bg-slate-900 border border-brand-200 dark:border-slate-700 rounded-xl font-bold focus:outline-none focus:border-brand-600" />
          <div id="smartSearchResults" class="hidden absolute left-0 right-0 top-11 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl z-20 max-h-52 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-700"></div>
        </div>

        <!-- Amount Input + Quick Chips -->
        <div class="mb-3">
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">المبلغ المدفوع (جنيه)</label>
          <input id="expAmountInput" type="number" inputmode="decimal" step="0.5" value="${existingExp ? existingExp.amount : ''}" placeholder="0" class="w-full px-3.5 py-2.5 text-xl font-extrabold text-brand-800 dark:text-teal-300 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:outline-none focus:border-brand-600" />
          <div class="flex gap-1.5 mt-1.5 overflow-x-auto no-scrollbar">
            ${[10, 20, 50, 100, 200, 500].map(v => `<button type="button" data-qamt="${v}" class="qamt-btn shrink-0 px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-brand-100 text-[11px] font-bold text-slate-700 dark:text-slate-200">+${v}</button>`).join('')}
          </div>
        </div>

        <!-- Category / Subcategory / Item Pickers -->
        <div class="mb-2.5">
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">1. اختر الفئة الرئيسية (${BASE_CATALOG.length} فئة)</label>
          <div id="catPicker" class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1"></div>
        </div>
        <div class="mb-2.5">
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">2. التصنيف الفرعي</label>
          <div id="subPicker" class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1"></div>
        </div>
        <div class="mb-3">
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">3. اختر الصنف (أو اضغط "أخرى" للكتابة اليدوية)</label>
          <div id="itemPicker" class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto p-2 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700"></div>
        </div>

        <!-- Custom "أخرى" Manual Input -->
        <div id="customItemWrap" class="${isCustomOther ? '' : 'hidden'} mb-3 space-y-1.5">
          <label class="block text-xs font-bold text-amber-700 dark:text-amber-300">✏️ اكتب اسم المصروف / الصنف يدوياً</label>
          <input id="customItemInput" type="text" value="${escapeHtml(selectedItemName)}" placeholder="مثال: تصليح كوتشي عمر، شحن كارت..." class="w-full px-3 py-2 text-xs bg-amber-50 dark:bg-amber-950/40 border border-amber-300 dark:border-amber-700 rounded-xl font-bold focus:outline-none focus:border-amber-600" />
        </div>

        <div class="mb-3 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 flex items-center justify-between text-xs">
          <span class="text-slate-500 dark:text-slate-400 font-semibold">الصنف المختار:</span>
          <span id="chosenItemBadge" class="font-extrabold text-brand-800 dark:text-teal-300">${escapeHtml(selectedItemName || 'اختر صنفاً أو اكتب يدوياً')}</span>
        </div>

        <!-- Budget Envelope (Includes "مصروفات أخرى - خصم من الراتب مباشرة") + Date -->
        <div class="grid grid-cols-2 gap-2 mb-3">
          <div>
            <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-400 mb-1">يُخصم من بند الميزانية</label>
            <select id="expBudgetSelect" class="w-full px-2.5 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl font-bold">
              <option value="${DIRECT_SALARY_ID}" ${selectedBudgetId === DIRECT_SALARY_ID ? 'selected' : ''}>💵 مصروفات أخرى (من الراتب مباشرة)</option>
              ${(month.budgets || []).map(b => `<option value="${escapeHtml(b.id)}" ${b.id === selectedBudgetId ? 'selected' : ''}>${escapeHtml(b.name)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-400 mb-1">التاريخ</label>
            <input id="expDateInput" type="date" value="${escapeHtml(defaultDate)}" class="w-full px-2.5 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl font-bold" />
          </div>
        </div>

        <div class="mb-4">
          <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-400 mb-1">الكمية / ملاحظة (اختياري)</label>
          <input id="expNoteInput" type="text" value="${escapeHtml(existingExp ? (existingExp.note || '') : '')}" placeholder="مثال: كيلو كل نص لوحده، من عند عكوش..." class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl" />
        </div>

        <button type="button" id="btnSubmitExpense" class="w-full py-3 rounded-xl bg-brand-700 hover:bg-brand-800 text-white text-sm font-extrabold shadow-md active:scale-95 transition">
          ${existingExp ? 'حفظ التعديلات' : 'حفظ المصروف'}
        </button>
      `);

      document.getElementById('closeExpModal').addEventListener('click', closeModal);
      document.querySelectorAll('.qamt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const inp = document.getElementById('expAmountInput');
          inp.value = (Number(inp.value) || 0) + Number(btn.dataset.qamt);
        });
      });
      document.querySelectorAll('.qfav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const fav = QUICK_FAVORITES[Number(btn.dataset.qfav)];
          selectedCatId = fav.catId; selectedSubName = fav.subName; selectedItemName = fav.itemName; isCustomOther = false;
          document.getElementById('expBudgetSelect').value = findBudgetIdForCat(fav.catId);
          renderPickers();
          document.getElementById('expAmountInput').focus();
        });
      });

      function updateChosenBadge() {
        const badge = document.getElementById('chosenItemBadge');
        const customVal = document.getElementById('customItemInput').value.trim();
        badge.textContent = isCustomOther ? (customVal || 'أخرى (اكتب الاسم فوق)') : (selectedItemName || 'اختر صنفاً');
      }

      function renderPickers() {
        const catEl = document.getElementById('catPicker');
        catEl.innerHTML = BASE_CATALOG.map(c => `
          <button type="button" data-cid="${c.id}" class="cat-chip shrink-0 px-2.5 py-1.5 rounded-xl text-xs font-bold border transition flex items-center gap-1 ${c.id === selectedCatId ? 'bg-brand-700 text-white border-brand-700' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700'}">
            <span>${c.icon}</span><span>${escapeHtml(c.name)}</span>
          </button>
        `).join('');

        const curCat = getCatById(selectedCatId);
        if (!curCat.subcategories.some(s => s.name === selectedSubName)) selectedSubName = curCat.subcategories[0].name;
        const subEl = document.getElementById('subPicker');
        subEl.innerHTML = curCat.subcategories.map(s => `
          <button type="button" data-sname="${escapeHtml(s.name)}" class="sub-chip shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold border ${s.name === selectedSubName ? 'bg-slate-800 dark:bg-teal-600 text-white border-slate-800' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-200 border-slate-200 dark:border-slate-600'}">
            ${escapeHtml(s.name)}
          </button>
        `).join('');

        const curSub = curCat.subcategories.find(s => s.name === selectedSubName) || curCat.subcategories[0];
        const itemEl = document.getElementById('itemPicker');
        itemEl.innerHTML = curSub.items.map(it => {
          const isOtherBtn = it === 'أخرى';
          const active = isOtherBtn ? isCustomOther : (!isCustomOther && selectedItemName === it);
          return `
            <button type="button" data-iname="${escapeHtml(it)}" class="item-chip px-2.5 py-1.5 rounded-lg text-xs font-bold border transition ${active ? (isOtherBtn ? 'bg-amber-600 text-white border-amber-600' : 'bg-brand-600 text-white border-brand-600') : (isOtherBtn ? 'bg-amber-50 dark:bg-amber-950/50 text-amber-800 dark:text-amber-300 border-amber-300 dark:border-amber-700' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700')}">
              ${isOtherBtn ? '✏️ أخرى (كتابة يدوية)' : escapeHtml(it)}
            </button>
          `;
        }).join('');

        document.getElementById('customItemWrap').classList.toggle('hidden', !isCustomOther);
        updateChosenBadge();

        catEl.querySelectorAll('.cat-chip').forEach(b => {
          b.addEventListener('click', () => {
            selectedCatId = b.dataset.cid;
            isCustomOther = (selectedCatId === 'other');
            if (!isCustomOther) selectedItemName = '';
            document.getElementById('expBudgetSelect').value = findBudgetIdForCat(selectedCatId);
            renderPickers();
            if (isCustomOther) document.getElementById('customItemInput').focus();
          });
        });
        subEl.querySelectorAll('.sub-chip').forEach(b => {
          b.addEventListener('click', () => { selectedSubName = b.dataset.sname; renderPickers(); });
        });
        itemEl.querySelectorAll('.item-chip').forEach(b => {
          b.addEventListener('click', () => {
            const it = b.dataset.iname;
            if (it === 'أخرى') {
              isCustomOther = true; renderPickers(); document.getElementById('customItemInput').focus();
            } else {
              isCustomOther = false; selectedItemName = it; renderPickers();
            }
          });
        });
      }

      renderPickers();
      document.getElementById('customItemInput').addEventListener('input', updateChosenBadge);

      const smartInput = document.getElementById('smartItemSearch');
      const smartRes = document.getElementById('smartSearchResults');
      smartInput.addEventListener('input', () => {
        const q = smartInput.value.trim().toLowerCase();
        if (!q) { smartRes.classList.add('hidden'); return; }
        const hits = flatCatalog.filter(f => f.itemName.toLowerCase().includes(q) || f.subName.toLowerCase().includes(q) || f.catName.toLowerCase().includes(q)).slice(0, 14);
        let html = hits.map((h, i) => `
          <button type="button" data-hit="${i}" class="smart-hit w-full text-right px-3 py-2 hover:bg-brand-50 dark:hover:bg-slate-700 flex items-center justify-between gap-2">
            <div>
              <div class="text-xs font-extrabold text-slate-800 dark:text-slate-100">${h.catIcon} ${escapeHtml(h.itemName)}</div>
              <div class="text-[10px] text-slate-500 dark:text-slate-400">${escapeHtml(h.catName)} ← ${escapeHtml(h.subName)}</div>
            </div>
            <span class="text-[10px] font-bold text-brand-700 dark:text-teal-300 bg-brand-50 dark:bg-brand-900/40 px-2 py-0.5 rounded-full">اختيار</span>
          </button>
        `).join('');
        html += `<button type="button" id="smartUseCustom" class="w-full text-right px-3 py-2 bg-amber-50 dark:bg-amber-950/40 text-xs font-extrabold text-amber-800 dark:text-amber-300">✏️ إضافة "${escapeHtml(smartInput.value.trim())}" كصنف مخصص (أخرى)</button>`;
        smartRes.innerHTML = html;
        smartRes.classList.remove('hidden');

        smartRes.querySelectorAll('.smart-hit').forEach(btn => {
          btn.addEventListener('click', () => {
            const h = hits[Number(btn.dataset.hit)];
            selectedCatId = h.catId; selectedSubName = h.subName; selectedItemName = h.itemName; isCustomOther = false;
            document.getElementById('expBudgetSelect').value = findBudgetIdForCat(h.catId);
            smartInput.value = ''; smartRes.classList.add('hidden'); renderPickers();
            document.getElementById('expAmountInput').focus();
          });
        });
        document.getElementById('smartUseCustom').addEventListener('click', () => {
          selectedCatId = 'other'; selectedSubName = 'مصروف مخصص'; isCustomOther = true;
          selectedItemName = smartInput.value.trim();
          document.getElementById('customItemInput').value = selectedItemName;
          smartInput.value = ''; smartRes.classList.add('hidden'); renderPickers();
          document.getElementById('expAmountInput').focus();
        });
      });

      document.getElementById('btnSubmitExpense').addEventListener('click', () => {
        const amt = Number(document.getElementById('expAmountInput').value);
        if (!amt || amt <= 0) { showToast('أدخل مبلغاً صحيحاً أكبر من صفر', 'error'); return; }
        const finalName = isCustomOther ? document.getElementById('customItemInput').value.trim() : selectedItemName;
        if (!finalName) { showToast('اختر صنفاً أو اكتب اسم المصروف في خانة أخرى', 'error'); return; }

        const budgetId = document.getElementById('expBudgetSelect').value;
        const dateVal = document.getElementById('expDateInput').value || defaultDate;
        const noteVal = document.getElementById('expNoteInput').value.trim();
        const nowTime = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        const nowIso = new Date().toISOString();

        if (existingExp) {
          existingExp.amount = amt; existingExp.catId = selectedCatId; existingExp.subName = selectedSubName;
          existingExp.itemName = finalName; existingExp.budgetId = budgetId; existingExp.date = dateVal;
          existingExp.note = noteVal; existingExp.updatedAt = nowIso;
          logActivity(`عدّل مصروف "${finalName}" إلى ${fmt(amt)} ج`);
          showToast('تم تعديل المصروف بنجاح');
        } else {
          month.expenses.unshift({
            id: 'exp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            date: dateVal, time: nowTime, amount: amt, catId: selectedCatId, subName: selectedSubName,
            itemName: finalName, budgetId, note: noteVal, userId: state.activeUserId, createdAt: nowIso, updatedAt: nowIso
          });
          logActivity(`سجّل مصروف "${finalName}" بقيمة ${fmt(amt)} ج`);
          showToast(`تم تسجيل "${finalName}" (${fmt(amt)} ج)`);
        }
        saveState();
        closeModal();
        renderAll();
      });
    }

    // --- INCOME MODAL ---
    function openIncomeModal(existingInc = null) {
      const month = getCurrentMonth();
      showModal(`
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${existingInc ? 'تعديل مصدر دخل' : 'إضافة دخل جديد للشهر'}</h3>
          <button type="button" id="closeIncModal" class="p-1.5 rounded-full bg-slate-100 dark:bg-slate-700"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">اسم مصدر الدخل</label>
            <input id="incNameInput" type="text" value="${escapeHtml(existingInc ? existingInc.name : '')}" placeholder="مثال: مرتب محمود، دخل نورا، منحة استثنائية..." class="w-full px-3 py-2.5 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl font-bold" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">المبلغ (جنيه)</label>
            <input id="incAmtInput" type="number" inputmode="decimal" value="${existingInc ? existingInc.amount : ''}" placeholder="0" class="w-full px-3 py-2.5 text-lg font-extrabold text-emerald-700 dark:text-emerald-400 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl" />
          </div>
          <div class="flex gap-2 pt-1">
            <button type="button" id="btnSaveInc" class="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">حفظ الدخل</button>
            ${existingInc ? `<button type="button" id="btnDelInc" class="px-4 py-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/50 text-rose-600 text-xs font-extrabold">حذف</button>` : ''}
          </div>
        </div>
      `);
      document.getElementById('closeIncModal').addEventListener('click', closeModal);
      document.getElementById('btnSaveInc').addEventListener('click', () => {
        const name = document.getElementById('incNameInput').value.trim();
        const amt = Number(document.getElementById('incAmtInput').value);
        if (!name || !amt || amt <= 0) { showToast('أدخل اسم الدخل والمبلغ بشكل صحيح', 'error'); return; }
        const nowIso = new Date().toISOString();
        if (existingInc) {
          existingInc.name = name; existingInc.amount = amt; existingInc.updatedAt = nowIso;
          logActivity(`عدّل دخل "${name}" إلى ${fmt(amt)} ج`);
        } else {
          month.incomes.push({ id: 'inc_' + Date.now(), name, amount: amt, userId: state.activeUserId, createdAt: nowIso, updatedAt: nowIso });
          logActivity(`أضاف دخل "${name}" بقيمة ${fmt(amt)} ج`);
        }
        saveState();
        closeModal();
        renderAll();
        showToast('تم تحديث إجمالي الدخل');
      });
      if (existingInc) {
        document.getElementById('btnDelInc').addEventListener('click', () => {
          month.incomes = month.incomes.filter(x => x.id !== existingInc.id);
          state.deletedIds.push(existingInc.id);
          logActivity(`حذف مصدر دخل "${existingInc.name}"`);
          saveState();
          closeModal();
          renderAll();
          showToast('تم حذف مصدر الدخل');
        });
      }
    }

    // --- BUDGET ALLOCATION MODAL (With "أخرى" Custom Input Box!) ---
    function openBudgetModal(existingBud = null) {
      const month = getCurrentMonth();
      const sum = calcMonthSummary(month);
      const isOtherCat = existingBud && existingBud.catId === 'other';

      showModal(`
        <div class="flex items-center justify-between mb-3">
          <div>
            <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${existingBud ? 'تعديل قسم الميزانية' : 'إضافة قسم ميزانية جديد'}</h3>
            <div class="text-[11px] text-brand-700 dark:text-teal-400 font-bold">المتاح حالياً للتقسيم: ${fmt(sum.unallocated + (existingBud ? Number(existingBud.planned) : 0))} ج</div>
          </div>
          <button type="button" id="closeBudModal" class="p-1.5 rounded-full bg-slate-100 dark:bg-slate-700"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">اسم البند / القسم</label>
            <input id="budNameInput" type="text" value="${escapeHtml(existingBud ? existingBud.name : '')}" placeholder="مثال: مصروف البيت والخزين، دروس عمر، كهرباء..." class="w-full px-3 py-2.5 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl font-bold" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">المبلغ المخصص (ج)</label>
              <input id="budPlanInput" type="number" inputmode="decimal" value="${existingBud ? existingBud.planned : ''}" placeholder="0" class="w-full px-3 py-2 text-base font-extrabold text-brand-800 dark:text-teal-300 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">النوع</label>
              <select id="budTypeSelect" class="w-full px-2.5 py-2.5 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl font-bold">
                <option value="fixed" ${existingBud && existingBud.type === 'fixed' ? 'selected' : ''}>مصروف ثابت</option>
                <option value="variable" ${!existingBud || existingBud.type === 'variable' ? 'selected' : ''}>مصروف متغير</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">الفئة المرتبطة</label>
            <select id="budCatSelect" class="w-full px-2.5 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl font-bold">
              ${BASE_CATALOG.map(c => `<option value="${c.id}" ${existingBud && existingBud.catId === c.id ? 'selected' : ''}>${c.icon} ${escapeHtml(c.name)}</option>`).join('')}
            </select>
          </div>
          <!-- Shows immediately when "أخرى" is selected -->
          <div id="budOtherCatWrap" class="${isOtherCat ? '' : 'hidden'}">
            <label class="block text-xs font-bold text-amber-700 dark:text-amber-300 mb-1">✏️ اكتب اسم الفئة / التصنيف المخصص (أخرى)</label>
            <input id="budOtherCatInput" type="text" value="${escapeHtml(existingBud ? (existingBud.customCatLabel || '') : '')}" placeholder="اكتب التصنيف اللي عايزه هنا..." class="w-full px-3 py-2 text-xs bg-amber-50 dark:bg-amber-950/40 border border-amber-300 dark:border-amber-700 rounded-xl font-bold" />
          </div>
          <div class="flex gap-2 pt-1">
            <button type="button" id="btnSaveBud" class="flex-1 py-2.5 rounded-xl bg-brand-700 text-white text-xs font-extrabold">حفظ وتخصيص</button>
            ${existingBud ? `<button type="button" id="btnDelBud" class="px-4 py-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/50 text-rose-600 text-xs font-extrabold">حذف</button>` : ''}
          </div>
        </div>
      `);
      document.getElementById('closeBudModal').addEventListener('click', closeModal);
      const catSel = document.getElementById('budCatSelect');
      catSel.addEventListener('change', () => {
        const isOth = catSel.value === 'other';
        document.getElementById('budOtherCatWrap').classList.toggle('hidden', !isOth);
        if (isOth) document.getElementById('budOtherCatInput').focus();
      });

      document.getElementById('btnSaveBud').addEventListener('click', () => {
        const name = document.getElementById('budNameInput').value.trim();
        const planned = Number(document.getElementById('budPlanInput').value) || 0;
        const type = document.getElementById('budTypeSelect').value;
        const catId = catSel.value;
        const customCatLabel = catId === 'other' ? document.getElementById('budOtherCatInput').value.trim() : '';
        if (!name) { showToast('أدخل اسم البند', 'error'); return; }
        const nowIso = new Date().toISOString();
        if (existingBud) {
          existingBud.name = name; existingBud.planned = planned; existingBud.type = type;
          existingBud.catId = catId; existingBud.customCatLabel = customCatLabel; existingBud.updatedAt = nowIso;
          logActivity(`عدّل مخصص "${name}" إلى ${fmt(planned)} ج`);
        } else {
          month.budgets.push({ id: 'b_' + Date.now(), name, planned, type, catId, customCatLabel, updatedAt: nowIso });
          logActivity(`أضاف بند ميزانية "${name}" بمبلغ ${fmt(planned)} ج`);
        }
        saveState();
        closeModal();
        renderAll();
        showToast('تم حفظ وتحديث البند فوراً');
      });
      if (existingBud) {
        document.getElementById('btnDelBud').addEventListener('click', () => {
          month.budgets = month.budgets.filter(x => x.id !== existingBud.id);
          state.deletedIds.push(existingBud.id);
          logActivity(`حذف بند الميزانية "${existingBud.name}"`);
          saveState();
          closeModal();
          renderAll();
          showToast('تم حذف البند');
        });
      }
    }

    // --- MONTHS MANAGER MODAL (Add / Rename / Delete Months) ---
    function openAddMonthModal() {
      const arMonths = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
      const keys = Object.keys(state.months).sort().reverse();

      showModal(`
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-base font-extrabold text-slate-900 dark:text-white">إدارة الشهور (إضافة / تعديل / حذف)</h3>
          <button type="button" id="closeMonthModal" class="p-1.5 rounded-full bg-slate-100 dark:bg-slate-700"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>

        <!-- Add New Month -->
        <div class="p-3 rounded-xl bg-brand-50/70 dark:bg-slate-900/60 border border-brand-200 dark:border-slate-700 space-y-2.5 mb-4">
          <div class="text-xs font-extrabold text-brand-800 dark:text-teal-300">+ فتح شهر جديد</div>
          <div class="grid grid-cols-2 gap-2">
            <select id="newMonthNum" class="w-full px-3 py-2 text-xs font-bold bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl">
              ${arMonths.map((m, i) => `<option value="${String(i + 1).padStart(2, '0')}" ${i === 11 ? 'selected' : ''}>${m}</option>`).join('')}
            </select>
            <input id="newMonthYear" type="number" value="2026" class="w-full px-3 py-2 text-xs font-bold bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl" />
          </div>
          <label class="flex items-center gap-2 text-xs font-bold text-slate-700 dark:text-slate-300">
            <input id="copyPrevPlan" type="checkbox" checked class="w-4 h-4 accent-brand-700" />
            <span>نسخ مصادر الدخل وأقسام الميزانية من الشهر الحالي</span>
          </label>
          <button type="button" id="btnCreateMonth" class="w-full py-2 rounded-xl bg-brand-700 text-white text-xs font-extrabold">إنشاء الشهر</button>
        </div>

        <!-- Existing Months (Edit / Delete) -->
        <div class="space-y-2">
          <div class="text-xs font-extrabold text-slate-600 dark:text-slate-300">الشهور الحالية (${keys.length})</div>
          ${keys.map(k => {
            const m = state.months[k];
            return `
              <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 flex items-center justify-between gap-2">
                <div class="min-w-0">
                  <div class="text-xs font-extrabold text-slate-800 dark:text-slate-100">${escapeHtml(m.label)}</div>
                  <div class="text-[10px] text-slate-400">${(m.expenses || []).length} مصروف • ${(m.budgets || []).length} بند</div>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  <button type="button" data-rename-month="${escapeHtml(k)}" class="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 text-[11px] font-bold text-slate-700 dark:text-slate-200">تعديل</button>
                  ${keys.length > 1 ? `<button type="button" data-del-month="${escapeHtml(k)}" class="px-2.5 py-1 rounded-lg bg-rose-50 dark:bg-rose-950/50 text-[11px] font-bold text-rose-600">حذف</button>` : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `);

      document.getElementById('closeMonthModal').addEventListener('click', closeModal);
      document.getElementById('btnCreateMonth').addEventListener('click', () => {
        const mNum = document.getElementById('newMonthNum').value;
        const yr = document.getElementById('newMonthYear').value.trim() || '2026';
        const key = `${yr}-${mNum}`;
        if (state.months[key]) { state.activeMonthKey = key; closeModal(); renderAll(); showToast('هذا الشهر موجود بالفعل — تم فتحه'); return; }
        const label = `${arMonths[Number(mNum) - 1]} ${yr}`;
        const cur = getCurrentMonth();
        const copy = document.getElementById('copyPrevPlan').checked;
        const nowIso = new Date().toISOString();
        state.deletedMonths = (state.deletedMonths || []).filter(x => x !== key);
        state.months[key] = {
          key, label, updatedAt: nowIso,
          incomes: copy ? cur.incomes.map((x, i) => ({ ...x, id: `inc_${key}_${i}`, updatedAt: nowIso })) : [],
          budgets: copy ? cur.budgets.map((x, i) => ({ ...x, id: `b_${key}_${i}`, updatedAt: nowIso })) : createDefaultBudgetItems().budgets,
          expenses: []
        };
        state.activeMonthKey = key;
        logActivity(`أنشأ ميزانية شهر ${label}`);
        saveState();
        closeModal();
        renderAll();
        showToast(`تم إنشاء شهر ${label}`);
      });

      document.querySelectorAll('[data-rename-month]').forEach(btn => {
        btn.addEventListener('click', () => {
          const mk = btn.dataset.renameMonth;
          const m = state.months[mk];
          if (!m) return;
          showModal(`
            <h3 class="text-sm font-extrabold text-slate-900 dark:text-white mb-2">تعديل اسم الشهر</h3>
            <input id="renameMonthInput" type="text" value="${escapeHtml(m.label)}" class="w-full px-3 py-2 text-xs font-bold bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl mb-3" />
            <div class="grid grid-cols-2 gap-2">
              <button type="button" id="btnDoRenameMonth" class="py-2 rounded-xl bg-brand-700 text-white text-xs font-extrabold">حفظ الاسم</button>
              <button type="button" id="btnCancelRename" class="py-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-xs font-bold">إلغاء</button>
            </div>
          `);
          document.getElementById('btnCancelRename').addEventListener('click', openAddMonthModal);
          document.getElementById('btnDoRenameMonth').addEventListener('click', () => {
            const nl = document.getElementById('renameMonthInput').value.trim();
            if (!nl) return;
            m.label = nl;
            m.updatedAt = new Date().toISOString();
            logActivity(`عدّل اسم الشهر إلى "${nl}"`);
            saveState();
            openAddMonthModal();
            renderAll();
            showToast('تم تعديل اسم الشهر');
          });
        });
      });

      document.querySelectorAll('[data-del-month]').forEach(btn => {
        btn.addEventListener('click', () => {
          const mk = btn.dataset.delMonth;
          const m = state.months[mk];
          if (!m || Object.keys(state.months).length <= 1) return;
          openConfirmModal(`حذف شهر "${m.label}" بكل بياناته ومصروفاته نهائياً؟`, () => {
            delete state.months[mk];
            if (!state.deletedMonths.includes(mk)) state.deletedMonths.push(mk);
            if (state.activeMonthKey === mk) state.activeMonthKey = Object.keys(state.months).sort().reverse()[0];
            logActivity(`حذف شهر "${m.label}"`);
            saveState();
            renderAll();
            showToast(`تم حذف شهر ${m.label}`);
          });
        });
      });
    }

    // --- SWITCH USER MODAL ---
    function openSwitchUserModal() {
      const uM = state.users.mahmoud;
      const uN = state.users.nora;
      showModal(`
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-base font-extrabold text-slate-900 dark:text-white">تبديل الحساب النشط</h3>
          <button type="button" id="closeUsrModal" class="p-1.5 rounded-full bg-slate-100 dark:bg-slate-700"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-3">
          ${[uM, uN].map(u => {
            const active = state.activeUserId === u.id;
            return `
              <button type="button" data-pick-user="${u.id}" class="pick-user-btn p-4 rounded-2xl border-2 text-center transition ${active ? 'border-brand-600 bg-brand-50 dark:bg-brand-900/40' : 'border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800'}">
                <div class="w-12 h-12 rounded-full mx-auto flex items-center justify-center text-white text-lg font-extrabold" style="background:${u.color}">${escapeHtml(u.avatar)}</div>
                <div class="mt-2 text-sm font-extrabold text-slate-800 dark:text-white">${escapeHtml(u.name)}</div>
                <div class="text-[11px] text-slate-500 dark:text-slate-400">${escapeHtml(u.role)} 🔒</div>
              </button>
            `;
          }).join('')}
        </div>
        <div id="pinPromptWrap" class="hidden space-y-2 pt-2 border-t border-slate-100 dark:border-slate-700">
          <label id="pinPromptLabel" class="block text-xs font-bold text-slate-700 dark:text-slate-300">أدخل الرقم السري (PIN)</label>
          <div class="flex gap-2">
            <input id="pinVerifyInput" type="password" inputmode="numeric" maxlength="4" class="flex-1 px-3 py-2 text-center text-base font-extrabold tracking-widest bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl" placeholder="••••" />
            <button type="button" id="btnVerifyPin" class="px-4 py-2 rounded-xl bg-brand-700 text-white text-xs font-bold">دخول</button>
          </div>
        </div>
      `);
      document.getElementById('closeUsrModal').addEventListener('click', closeModal);
      let pendingUserId = null;
      document.querySelectorAll('.pick-user-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const uid = btn.dataset.pickUser;
          if (uid === state.activeUserId) { closeModal(); return; }
          pendingUserId = uid;
          document.getElementById('pinPromptLabel').textContent = `أدخل الرقم السري لحساب ${state.users[uid].name}`;
          document.getElementById('pinPromptWrap').classList.remove('hidden');
          document.getElementById('pinVerifyInput').value = '';
          document.getElementById('pinVerifyInput').focus();
        });
      });
      document.getElementById('btnVerifyPin').addEventListener('click', () => {
        if (!pendingUserId) return;
        const target = state.users[pendingUserId];
        const expected = target.pin || (pendingUserId === 'mahmoud' ? '2006' : '2109');
        if (document.getElementById('pinVerifyInput').value.trim() === expected) {
          state.activeUserId = pendingUserId;
          try { localStorage.setItem(AUTH_KEY, JSON.stringify({ uid: pendingUserId, ts: Date.now() })); } catch (e) {}
          saveState(true);
          closeModal();
          renderAll();
          showToast(`تم التبديل إلى حساب ${target.name}`);
        } else {
          showToast('الرقم السري غير صحيح', 'error');
        }
      });
    }

    // --- IMPORT SYNC CODE MODAL ---
    function openImportSyncModal() {
      showModal(`
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-base font-extrabold text-slate-900 dark:text-white">استعادة / دمج نسخة احتياطية</h3>
          <button type="button" id="closeImpModal" class="p-1.5 rounded-full bg-slate-100 dark:bg-slate-700"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <textarea id="importCodeArea" rows="4" dir="ltr" class="w-full p-2.5 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl font-mono mb-3" placeholder="الصق الكود هنا..."></textarea>
        <button type="button" id="btnDoImport" class="w-full py-2.5 rounded-xl bg-brand-700 text-white text-xs font-extrabold">دمج وتحديث البيانات</button>
      `);
      document.getElementById('closeImpModal').addEventListener('click', closeModal);
      document.getElementById('btnDoImport').addEventListener('click', () => {
        try {
          const parsed = JSON.parse(decodeURIComponent(escape(atob(document.getElementById('importCodeArea').value.trim()))));
          if (!parsed || !parsed.months) throw new Error('invalid');
          mergeRemoteState(parsed);
          saveState();
          closeModal();
          renderAll();
          showToast('تم دمج البيانات بنجاح');
        } catch (e) { showToast('الكود غير صحيح', 'error'); }
      });
    }

    // --- CONFIRM MODAL ---
    function openConfirmModal(message, onConfirm) {
      showModal(`
        <h3 class="text-sm font-extrabold text-slate-900 dark:text-white mb-2">تأكيد</h3>
        <p class="text-xs text-slate-600 dark:text-slate-300 mb-4">${escapeHtml(message)}</p>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" id="btnConfirmYes" class="py-2.5 rounded-xl bg-rose-600 text-white text-xs font-extrabold">نعم، متأكد</button>
          <button type="button" id="btnConfirmNo" class="py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-extrabold">إلغاء</button>
        </div>
      `);
      document.getElementById('btnConfirmYes').addEventListener('click', () => { closeModal(); onConfirm(); });
      document.getElementById('btnConfirmNo').addEventListener('click', closeModal);
    }

    // =========================================================================
    // 12. PWA, SERVICE WORKER & GLOBAL BINDINGS
    // =========================================================================
    (function setupPwa() {
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    })();

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window._deferredInstallPrompt = e;
    });

    document.getElementById('btnApplyAppUpdate').addEventListener('click', async () => {
      try {
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map(n => caches.delete(n)));
        }
      } catch (e) {}
      location.reload();
    });

    document.querySelectorAll('.login-user-card').forEach(btn => {
      btn.addEventListener('click', () => {
        loginSelectedUid = btn.dataset.loginUid;
        loginPinBuffer = '';
        document.getElementById('loginErrorMsg').textContent = '';
        updateLoginUi();
      });
    });
    document.querySelectorAll('.pin-key[data-key]').forEach(btn => {
      btn.addEventListener('click', () => handleLoginDigit(btn.dataset.key));
    });
    document.getElementById('pinKeyClear').addEventListener('click', () => { loginPinBuffer = ''; document.getElementById('loginErrorMsg').textContent = ''; updateLoginUi(); });
    document.getElementById('pinKeyBack').addEventListener('click', () => { loginPinBuffer = loginPinBuffer.slice(0, -1); updateLoginUi(); });

    document.addEventListener('keydown', (e) => {
      if (isAuthenticated) return;
      if (e.key >= '0' && e.key <= '9') handleLoginDigit(e.key);
      else if (e.key === 'Backspace') { loginPinBuffer = loginPinBuffer.slice(0, -1); updateLoginUi(); }
    });

    document.getElementById('btnSwitchUser').addEventListener('click', openSwitchUserModal);
    document.getElementById('btnLockApp').addEventListener('click', lockAndLogout);
    document.getElementById('btnAddMonth').addEventListener('click', openAddMonthModal);
    document.getElementById('btnOpenAddExpense').addEventListener('click', () => openExpenseModal());
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => { activeTab = btn.dataset.tab; renderAll(); });
    });

    // Boot Sequence
    applyTheme();
    (function bootApp() {
      let remembered = null;
      try {
        const raw = localStorage.getItem(AUTH_KEY);
        if (raw) remembered = JSON.parse(raw);
      } catch (e) {}
      if (remembered && remembered.uid && state.users[remembered.uid]) {
        state.activeUserId = remembered.uid;
        isAuthenticated = true;
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('appRoot').classList.remove('hidden');
        renderAll();
        if (state.sync && state.sync.firebaseUrl) {
          pullFromFirebase(false);
          startCloudAutoSync();
        }
        checkForAppUpdate();
      } else {
        showLoginScreen(state.activeUserId);
      }
    })();
  </script>
</body>
</html>
