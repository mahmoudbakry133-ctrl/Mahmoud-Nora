      left: 50%;

      max-width: 92%;

    // =========================================================================
    // 3. STATE MANAGEMENT, MIGRATION, ZERO-LAG DEBOUNCED SYNC
    // =========================================================================
    const STORAGE_KEY = 'baytna_family_budget_v1';
    const AUTH_KEY = 'baytna_auth_session_v2';

    function migrateState(parsed) {
      if (!parsed.sync) parsed.sync = { firebaseUrl: 'https://bakry-5fb50-default-rtdb.firebaseio.com', lastSyncAt: '' };
      else if (!parsed.sync.firebaseUrl) parsed.sync.firebaseUrl = 'https://bakry-5fb50-default-rtdb.firebaseio.com';
      if (parsed.users.mahmoud && !parsed.users.mahmoud.pin) parsed.users.mahmoud.pin = '2006';
      if (parsed.users.nora && !parsed.users.nora.pin) parsed.users.nora.pin = '2109';
      if (!Array.isArray(parsed.shoppingList)) parsed.shoppingList = [];
      if (!Array.isArray(parsed.deletedIds)) parsed.deletedIds = [];
      if (!Array.isArray(parsed.deletedMonths)) parsed.deletedMonths = [];
      if (!Array.isArray(parsed.customCatalog)) parsed.customCatalog = [];
      if (!Array.isArray(parsed.chatMessages)) parsed.chatMessages = [];
      if (!parsed.chatLastRead) parsed.chatLastRead = { mahmoud: 0, nora: 0 };
      if (typeof parsed.darkMode !== 'boolean') parsed.darkMode = false;

      // Migrate old coupleNote into chatMessages if present
      if (parsed.coupleNote && parsed.coupleNote.text && parsed.chatMessages.length === 0) {
        parsed.chatMessages.push({
          id: 'msg_migrated_1',
          text: parsed.coupleNote.text,
          userId: parsed.coupleNote.userId || 'nora',
          ts: Date.now() - 60000,
          time: 'سابقاً'
        });
      }

      // Migrate legacy single-number debt into structured debt.items array
      if (!parsed.debt) parsed.debt = { total: 0, paid: 0, payments: [], items: [] };
      if (!Array.isArray(parsed.debt.items)) {
        parsed.debt.items = [];
        if ((Number(parsed.debt.total) || 0) > 0) {
          parsed.debt.items.push({
            id: 'debt_legacy_1',
            name: 'الدين المسجل سابقاً',
            type: 'urgent',
            total: Number(parsed.debt.total) || 0,
            paid: Number(parsed.debt.paid) || 0,
            dueDate: '',
            monthlyInstallment: 0,
            userId: 'mahmoud',
            updatedAt: new Date().toISOString()
          });
        }
      }
      return parsed;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.months && parsed.users) return migrateState(parsed);
        }
      } catch (e) {}
      return buildInitialState();
    }

    function saveState(skipCloud = false) {
      if (!skipCloud) lastLocalMutationAt = Date.now();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
      if (!skipCloud && state.sync && state.sync.firebaseUrl) {
        clearTimeout(pushDebounceTimer);
        pushDebounceTimer = setTimeout(() => pushToFirebase(), 250);
      }
    }

    function handleLoginDigit(digit) {
      if (loginPinBuffer.length >= 4) return;
      document.getElementById('loginErrorMsg').textContent = '';
      loginPinBuffer += digit;
      updateLoginUi();
      if (loginPinBuffer.length === 4) {
        const target = state.users[loginSelectedUid];
        const expectedPin = target.pin || (loginSelectedUid === 'mahmoud' ? '2006' : '2109');
        if (loginPinBuffer === expectedPin) {
          state.activeUserId = loginSelectedUid;
          isAuthenticated = true;
          const remember = document.getElementById('rememberLoginCheck').checked;
          try {
            if (remember) localStorage.setItem(AUTH_KEY, JSON.stringify({ uid: loginSelectedUid, ts: Date.now() }));
            else localStorage.removeItem(AUTH_KEY);
          } catch (e) {}
          saveState(true);
          document.getElementById('loginScreen').classList.add('hidden');
          document.getElementById('appRoot').classList.remove('hidden');
          renderAll();
          showToast(`أهلاً بك يا ${target.name} 🏠`);
          if (state.sync && state.sync.firebaseUrl) {
            pullFromFirebase(false);
            startCloudAutoSync();
          }
          checkForAppUpdate();
        } else {
          const dotsWrap = document.getElementById('loginPinDots');
          dotsWrap.classList.remove('animate-shake');
          void dotsWrap.offsetWidth;

    function lockAndLogout() {

      if (window._cloudSyncInterval) clearInterval(window._cloudSyncInterval);
      showLoginScreen(state.activeUserId);

    // =========================================================================
    // 4. CLOUD SYNC (ZERO-CONFLICT TIMESTAMP MERGE)
    // =========================================================================
    function normalizeFirebaseUrl(raw) {
      let u = (raw || '').trim();
      if (!u) return '';
      if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      return u.replace(/\/baytna_budget\.json$/i, '').replace(/\/+$/, '');
    }

    function describeFirebaseError(err) {
      const msg = String(err && err.message ? err.message : err || '');
      if (msg.includes('401') || msg.includes('403')) return { short: 'مقفول من Rules (401)', detail: 'افتح Firebase ← Rules وغيّرها لـ true ثم Publish' };
      if (msg.includes('404')) return { short: 'الرابط غير موجود (404)', detail: 'تأكد من رابط Realtime Database' };
      return { short: 'محفوظ محلياً (بانتظار النت)', detail: 'تعذر الاتصال بـ Firebase حالياً' };
    }

    async function pushToFirebase() {
      const url = normalizeFirebaseUrl(state.sync.firebaseUrl);
      if (!url || !url.startsWith('https://')) return;
      isPushingCloud = true;
      try {
        updateSyncIndicator('syncing', 'جاري الحفظ...');
        const payload = { ...state };
        delete payload.activeUserId;
        delete payload.darkMode;
        const res = await fetch(url + '/baytna_budget.json', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        state.sync.lastSyncAt = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        updateSyncIndicator('ok', 'متزامن ' + state.sync.lastSyncAt);
      } catch (e) {
        updateSyncIndicator('err', describeFirebaseError(e).short);
      } finally {
        isPushingCloud = false;
      }
    }

    async function pullFromFirebase(showMsg = false) {
      const url = normalizeFirebaseUrl(state.sync.firebaseUrl);
      if (!url || !url.startsWith('https://')) return;
      // Prevent stale background pull from overwriting a local edit made in the last 6 seconds
      if (!showMsg && (isPushingCloud || (Date.now() - lastLocalMutationAt) < 6000)) return;
      try {
        if (showMsg) updateSyncIndicator('syncing', 'جاري التحديث...');
        const res = await fetch(url + '/baytna_budget.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const remote = await res.json();
        if (remote && remote.months) {
          const myUserId = state.activeUserId;
          const myUrl = url;
          const myDark = state.darkMode;
          const myChatRead = { ...(state.chatLastRead || {}) };
          mergeRemoteState(remote);
          state.activeUserId = myUserId;
          state.sync.firebaseUrl = myUrl;
          state.darkMode = myDark;
          state.chatLastRead = {
            mahmoud: Math.max(myChatRead.mahmoud || 0, (remote.chatLastRead && remote.chatLastRead.mahmoud) || 0),
            nora: Math.max(myChatRead.nora || 0, (remote.chatLastRead && remote.chatLastRead.nora) || 0)
          };
          state.sync.lastSyncAt = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
          saveState(true);
          // Avoid closing an open modal while user is typing
          const modalOpen = !document.getElementById('modalContainer').classList.contains('hidden');
          if (isAuthenticated && !modalOpen) renderAll();
          updateSyncIndicator('ok', 'متزامن ' + state.sync.lastSyncAt);
          if (showMsg) showToast('تم التحديث والمزامنة السحابية بنجاح');
        } else {
          await pushToFirebase();
          if (showMsg) showToast('تم رفع بياناتك للسحابة بنجاح');
        }
      } catch (e) {
        const info = describeFirebaseError(e);
        updateSyncIndicator('err', info.short);
        if (showMsg) showToast(info.detail, 'error');
      }
    }

    function startCloudAutoSync() {
      if (window._cloudSyncInterval) clearInterval(window._cloudSyncInterval);
      if (state.sync && normalizeFirebaseUrl(state.sync.firebaseUrl)) {
        window._cloudSyncInterval = setInterval(() => {
          if (!document.hidden && isAuthenticated) pullFromFirebase(false);
        }, 12000);
      }
    }

    function mergeByUpdatedAt(locArr, remArr, delSet) {
      const map = new Map();
      (locArr || []).forEach(x => { if (x && x.id && !delSet.has(x.id)) map.set(x.id, x); });
      (remArr || []).forEach(x => {
        if (!x || !x.id || delSet.has(x.id)) return;
        const existing = map.get(x.id);
        if (!existing) { map.set(x.id, x); return; }
        const locTs = existing.updatedAt || existing.createdAt || '';
        const remTs = x.updatedAt || x.createdAt || '';
        if (remTs > locTs) map.set(x.id, x);
      });
      return Array.from(map.values());
    }

    function mergeRemoteState(remote) {
      if (!remote || !remote.months) return;
      const delSet = new Set([...(state.deletedIds || []), ...(remote.deletedIds || [])]);
      state.deletedIds = Array.from(delSet).slice(-500);
      const delMonths = new Set([...(state.deletedMonths || []), ...(remote.deletedMonths || [])]);
      state.deletedMonths = Array.from(delMonths);

      Object.keys(remote.months).forEach(mKey => {
        if (delMonths.has(mKey)) return;
        if (!state.months[mKey]) {
          state.months[mKey] = remote.months[mKey];
        } else {
          const loc = state.months[mKey];
          const rem = remote.months[mKey];
          if (rem.label && rem.updatedAt && rem.updatedAt > (loc.updatedAt || '')) loc.label = rem.label;
          loc.incomes = mergeByUpdatedAt(loc.incomes, rem.incomes, delSet);
          loc.budgets = mergeByUpdatedAt(loc.budgets, rem.budgets, delSet);
          loc.expenses = mergeByUpdatedAt(loc.expenses, rem.expenses, delSet)
            .sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
        }
      });

      // Remove locally deleted months
      delMonths.forEach(mk => { if (state.months[mk] && Object.keys(state.months).length > 1) delete state.months[mk]; });

      // Merge shopping list
      state.shoppingList = mergeByUpdatedAt(state.shoppingList, remote.shoppingList, delSet);

      // Merge custom catalog
      if (Array.isArray(remote.customCatalog)) {
        const ccMap = new Map();
        [...(state.customCatalog || []), ...remote.customCatalog].forEach(c => ccMap.set(c.catId + '|' + c.itemName, c));
        state.customCatalog = Array.from(ccMap.values());
      }

      // Merge debts
      if (remote.debt) {
        if (Array.isArray(remote.debt.items)) {
          state.debt.items = mergeByUpdatedAt(state.debt.items || [], remote.debt.items, delSet);
        } else if ((state.debt.items || []).length === 0 && (Number(remote.debt.total) || 0) > 0) {
          state.debt.items = [{
            id: 'debt_remote_legacy',
            name: 'الدين المسجل سابقاً',
            type: 'urgent',
            total: Number(remote.debt.total) || 0,
            paid: Number(remote.debt.paid) || 0,
            dueDate: '',
            monthlyInstallment: 0,
            userId: 'mahmoud',
            updatedAt: new Date().toISOString()
          }];
        }
      }

      // Merge mini-chat messages
      const msgMap = new Map();
      [...(state.chatMessages || []), ...(remote.chatMessages || [])].forEach(m => { if (m && m.id && !delSet.has(m.id)) msgMap.set(m.id, m); });
      state.chatMessages = Array.from(msgMap.values()).sort((a, b) => (a.ts || 0) - (b.ts || 0)).slice(-100);

      // Merge activity log
      if (remote.activityLog) {
        const actMap = new Map();
        [...(remote.activityLog || []), ...(state.activityLog || [])].forEach(a => { if (a && a.id) actMap.set(a.id, a); });
        state.activityLog = Array.from(actMap.values()).sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, 120);
      }
    }

    function updateSyncIndicator(status, text) {
      const dot = document.getElementById('syncStatusDot');
      const txt = document.getElementById('syncStatusText');
      if (!dot || !txt) return;
      txt.textContent = text;

    // =========================================================================
    // 5. COMPUTATIONS & SMART INSIGHTS
    // =========================================================================
    function getUnreadChatCount() {
      const lastRead = (state.chatLastRead && state.chatLastRead[state.activeUserId]) || 0;
      return (state.chatMessages || []).filter(m => m.userId !== state.activeUserId && (m.ts || 0) > lastRead).length;
    }

    function calcDebtTotals() {
      const items = state.debt.items || [];
      let total = 0, paid = 0, urgentRem = 0, deferredRem = 0, installmentRem = 0;
      items.forEach(d => {
        const t = Number(d.total) || 0;
        const p = Number(d.paid) || 0;
        const rem = Math.max(0, t - p);
        total += t;
        paid += p;
        if (d.type === 'urgent') urgentRem += rem;
        else if (d.type === 'installment') installmentRem += rem;
        else deferredRem += rem;
      });
      return { total, paid, remaining: Math.max(0, total - paid), urgentRem, deferredRem, installmentRem, count: items.length };
    }

    function calcMonthSummary(month) {
      const totalIncome = (month.incomes || []).reduce((s, i) => s + (Number(i.amount) || 0), 0);
      const totalPlanned = (month.budgets || []).reduce((s, b) => s + (Number(b.planned) || 0), 0);
      const unallocated = totalIncome - totalPlanned;

      const expenses = month.expenses || [];
      const totalSpent = expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
      const remaining = totalIncome - totalSpent;

      const byUser = { mahmoud: { total: 0, count: 0 }, nora: { total: 0, count: 0 } };
      const byBudget = {};
      const byCat = {};
      let directSalarySpent = 0;

      expenses.forEach(e => {
        const amt = Number(e.amount) || 0;
        const uid = e.userId === 'nora' ? 'nora' : 'mahmoud';
        byUser[uid].total += amt;
        byUser[uid].count += 1;
        if (e.budgetId && e.budgetId !== DIRECT_SALARY_ID) {
          byBudget[e.budgetId] = (byBudget[e.budgetId] || 0) + amt;
        } else if (e.budgetId === DIRECT_SALARY_ID) {
          directSalarySpent += amt;
        }
        byCat[e.catId] = (byCat[e.catId] || 0) + amt;
      });

      const fixedPlanned = (month.budgets || []).filter(b => b.type === 'fixed').reduce((s, b) => s + (Number(b.planned) || 0), 0);
      const varPlanned = (month.budgets || []).filter(b => b.type === 'variable').reduce((s, b) => s + (Number(b.planned) || 0), 0);

      // Daily & Weekly safe spend calculation
      const [yStr, mStr] = (month.key || '2026-11').split('-');
      const daysInMonth = new Date(Number(yStr), Number(mStr), 0).getDate() || 30;
      const now = new Date();
      const isSameMonth = now.getFullYear() === Number(yStr) && (now.getMonth() + 1) === Number(mStr);
      const daysLeft = isSameMonth ? Math.max(1, daysInMonth - now.getDate() + 1) : daysInMonth;
      const weeksLeft = Math.max(1, daysLeft / 7);
      const dailySafe = remaining > 0 ? Math.floor(remaining / daysLeft) : 0;
      const weeklySafe = remaining > 0 ? Math.floor(remaining / weeksLeft) : 0;

      const alerts = [];
      (month.budgets || []).forEach(b => {
        const spent = byBudget[b.id] || 0;
        const planned = Number(b.planned) || 0;
        if (planned > 0 && spent >= planned * 0.8) {
          alerts.push({ name: b.name, spent, planned, pct: Math.round((spent / planned) * 100), over: spent > planned });
        }
      });

      const savingsRate = totalIncome > 0 ? Math.round(((totalIncome - totalSpent) / totalIncome) * 100) : 0;

      return { totalIncome, totalPlanned, unallocated, totalSpent, remaining, byUser, byBudget, byCat, directSalarySpent, fixedPlanned, varPlanned, daysLeft, dailySafe, weeklySafe, alerts, savingsRate };
    }

          if (b) openBudgetModal(b);
        });
      });

          openConfirmModal(`حذف بند الميزانية "${b.name}" (${fmt(b.planned)} ج)؟`, () => {

    // Quick 1-step modal to log a budget envelope directly as an expense
    function openQuickSpendBudgetModal(b) {
      const month = getCurrentMonth();
      const sum = calcMonthSummary(month);
      const left = Math.max(0, (Number(b.planned) || 0) - (sum.byBudget[b.id] || 0));
      showModal(`
        <div class="flex items-center justify-between mb-3">
          <div>
            <h3 class="text-base font-extrabold text-slate-900 dark:text-white">صرف من بند "${escapeHtml(b.name)}"</h3>
            <div class="text-[11px] text-brand-700 dark:text-teal-400 font-bold">سيتسجل فوراً في صفحة المصروفات باسم ${escapeHtml(getActiveUser().name)}</div>
          </div>
          <button type="button" id="closeQuickSpend" class="p-1.5 rounded-full bg-slate-100 dark:bg-slate-700"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">المبلغ المصروف (جنيه)</label>
            <input id="qsAmount" type="number" inputmode="decimal" value="${left || b.planned || ''}" class="w-full px-3 py-2.5 text-xl font-extrabold text-brand-700 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">ملاحظة (اختياري)</label>
            <input id="qsNote" type="text" placeholder="مثال: دفع الفاتورة، اشتراك الشهر..." class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" id="btnConfirmQuickSpend" class="py-2.5 rounded-xl bg-brand-700 text-white text-xs font-extrabold">تسجيل كمصروف الآن ✓</button>
            <button type="button" id="btnOpenFullExpFromBud" class="py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold">اختيار صنف تفصيلي</button>
          </div>
        </div>
      `);
      document.getElementById('closeQuickSpend').addEventListener('click', closeModal);
      document.getElementById('btnOpenFullExpFromBud').addEventListener('click', () => { closeModal(); openExpenseModal(null, b.id, b.catId); });
      document.getElementById('btnConfirmQuickSpend').addEventListener('click', () => {
        const amt = Number(document.getElementById('qsAmount').value);
        if (!amt || amt <= 0) { showToast('أدخل مبلغاً صحيحاً', 'error'); return; }
        const todayStr = new Date().toISOString().slice(0, 10);
        const nowTime = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        const nowIso = new Date().toISOString();
        month.expenses.unshift({
          id: 'exp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          date: month.key === todayStr.slice(0, 7) ? todayStr : (month.key + '-01'),
          time: nowTime,
          amount: amt,
          catId: b.catId || 'other',
          subName: b.customCatLabel || 'صرف مباشر من البند',
          itemName: b.name,
          budgetId: b.id,
          note: document.getElementById('qsNote').value.trim(),
          userId: state.activeUserId,
          createdAt: nowIso,
          updatedAt: nowIso
        });
        logActivity(`صرف "${b.name}" بمبلغ ${fmt(amt)} ج`);
        saveState();
        closeModal();
        renderAll();
        showToast(`تم تسجيل "${b.name}" (${fmt(amt)} ج) في المصروفات`);
      });
    }

    // =========================================================================
    // 9. TAB 3: DAILY EXPENSES LEDGER (سجل المصروفات اليومي + ملخص اليوم)
    // =========================================================================
    function renderExpensesTab(container) {
      const month = getCurrentMonth();
      const all = month.expenses || [];
      const todayStr = new Date().toISOString().slice(0, 10);
      const todayTotal = all.filter(e => e.date === todayStr).reduce((s, e) => s + (Number(e.amount) || 0), 0);

      const filtered = all.filter(e => {
        if (expenseFilter.user !== 'all' && e.userId !== expenseFilter.user) return false;
        if (expenseFilter.catId !== 'all' && e.catId !== expenseFilter.catId) return false;
        if (expenseFilter.budgetId !== 'all' && e.budgetId !== expenseFilter.budgetId) return false;
        if (expenseFilter.search.trim()) {
          const q = expenseFilter.search.trim().toLowerCase();
          const hay = `${e.itemName} ${e.subName} ${e.note || ''} ${getCatById(e.catId).name}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      }).sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));

      const filteredTotal = filtered.reduce((s, e) => s + (Number(e.amount) || 0), 0);

      const grouped = {};
      filtered.forEach(e => {
        const d = e.date || 'بدون تاريخ';
        if (!grouped[d]) grouped[d] = [];
        grouped[d].push(e);
      });

      container.innerHTML = `
        <!-- Quick Today Summary + Jump to Basket -->
        <section class="grid grid-cols-2 gap-2">
          <div class="bg-white dark:bg-slate-800 rounded-2xl p-3 border border-slate-200 dark:border-slate-700 shadow-sm">
            <div class="text-[10px] font-bold text-slate-400">إجمالي صرف اليوم</div>
            <div class="text-base font-black text-brand-700 dark:text-teal-400 mt-0.5">${fmt(todayTotal)} <span class="text-xs font-semibold">ج</span></div>
          </div>
          <button type="button" id="btnJumpBasket" class="bg-emerald-50 dark:bg-emerald-950/40 rounded-2xl p-3 border border-emerald-200 dark:border-emerald-800 text-right flex items-center justify-between">
            <div>
              <div class="text-[10px] font-bold text-emerald-700 dark:text-emerald-300">سلة طلبات البيت</div>
              <div class="text-xs font-extrabold text-emerald-900 dark:text-emerald-100 mt-0.5">${(state.shoppingList || []).filter(x => !x.done).length} طلب بالانتظار</div>
            </div>
            <span class="text-xl">🧺</span>
          </button>
        </section>

        <!-- Search & Filter Box -->
        <section class="bg-white dark:bg-slate-800 rounded-2xl p-3 border border-slate-200 dark:border-slate-700 shadow-sm space-y-2.5">
          <div class="relative">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute right-3 top-1/2 -translate-y-1/2"></i>
            <input id="expSearchInput" type="text" value="${escapeHtml(expenseFilter.search)}" placeholder="ابحث في المصروفات (بانيه، توكتوك، فول...)" class="w-full pr-9 pl-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:border-brand-600" />
          </div>
          <div class="grid grid-cols-3 gap-1.5">
            <button type="button" data-ufilter="all" class="ufilter-btn py-1.5 rounded-lg text-xs font-bold ${expenseFilter.user === 'all' ? 'bg-brand-700 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}">الكل</button>
            <button type="button" data-ufilter="mahmoud" class="ufilter-btn py-1.5 rounded-lg text-xs font-bold ${expenseFilter.user === 'mahmoud' ? 'bg-sky-600 text-white' : 'bg-sky-50 dark:bg-sky-950/50 text-sky-700 dark:text-sky-300'}">${escapeHtml(state.users.mahmoud.name)}</button>
            <button type="button" data-ufilter="nora" class="ufilter-btn py-1.5 rounded-lg text-xs font-bold ${expenseFilter.user === 'nora' ? 'bg-pink-600 text-white' : 'bg-pink-50 dark:bg-pink-950/50 text-pink-700 dark:text-pink-300'}">${escapeHtml(state.users.nora.name)}</button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <select id="expCatFilter" class="text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-2.5 py-2 font-semibold text-slate-700 dark:text-slate-200">
              <option value="all">كل الفئات</option>
              ${BASE_CATALOG.map(c => `<option value="${escapeHtml(c.id)}" ${expenseFilter.catId === c.id ? 'selected' : ''}>${c.icon} ${escapeHtml(c.name)}</option>`).join('')}
            </select>
            <select id="expBudFilter" class="text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-2.5 py-2 font-semibold text-slate-700 dark:text-slate-200">
              <option value="all">كل بنود الميزانية</option>
              <option value="${DIRECT_SALARY_ID}" ${expenseFilter.budgetId === DIRECT_SALARY_ID ? 'selected' : ''}>💵 مصروفات أخرى (من الراتب)</option>
              ${(month.budgets || []).map(b => `<option value="${escapeHtml(b.id)}" ${expenseFilter.budgetId === b.id ? 'selected' : ''}>${escapeHtml(b.name)}</option>`).join('')}
            </select>
          </div>
          <div class="flex items-center justify-between pt-1 border-t border-slate-100 dark:border-slate-700 text-xs">
            <span class="text-slate-500 dark:text-slate-400 font-semibold">عدد النتائج: <strong>${filtered.length}</strong></span>
            <span class="font-extrabold text-brand-700 dark:text-teal-400">الإجمالي: ${fmt(filteredTotal)} ج</span>
          </div>
        </section>

        <!-- Grouped Daily List -->
        ${filtered.length === 0 ? `
          <div class="bg-white dark:bg-slate-800 rounded-2xl p-8 border border-slate-200 dark:border-slate-700 text-center">
            <div class="text-3xl mb-2">🧾</div>
            <div class="text-sm font-extrabold text-slate-700 dark:text-slate-200">لا توجد مصروفات مطابقة</div>
            <button type="button" id="btnEmptyAddExp" class="mt-3 px-4 py-2 rounded-xl bg-brand-700 text-white text-xs font-bold">+ تسجيل مصروف الآن</button>
          </div>
        ` : Object.keys(grouped).map(dateKey => {
          const dayItems = grouped[dateKey];
          const daySum = dayItems.reduce((s, x) => s + (Number(x.amount) || 0), 0);
          return `
            <section class="space-y-2">
              <div class="flex items-center justify-between px-1">
                <span class="text-xs font-extrabold text-slate-600 dark:text-slate-300">📅 ${escapeHtml(dateKey)}</span>
                <span class="text-xs font-extrabold text-brand-700 dark:text-teal-400">${fmt(daySum)} ج</span>
              </div>
              <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 divide-y divide-slate-100 dark:divide-slate-700 shadow-sm overflow-hidden">
                ${dayItems.map(e => {
                  const cat = getCatById(e.catId);
                  const usr = state.users[e.userId] || state.users.mahmoud;
                  const isDirect = e.budgetId === DIRECT_SALARY_ID;
                  const bud = isDirect ? null : (month.budgets || []).find(b => b.id === e.budgetId);
                  const isOwner = e.userId === state.activeUserId;
                  return `
                    <div class="p-3 flex items-start justify-between gap-2.5">
                      <div class="flex items-start gap-2.5 min-w-0">
                        <div class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-lg shrink-0">${cat.icon}</div>
                        <div class="min-w-0">
                          <div class="text-xs font-extrabold text-slate-800 dark:text-slate-100">${escapeHtml(e.itemName)}</div>
                          <div class="text-[11px] text-slate-500 dark:text-slate-400">${escapeHtml(cat.name)} • ${escapeHtml(e.subName || '')}</div>
                          ${e.note ? `<div class="text-[11px] text-slate-600 dark:text-slate-300 bg-slate-50 dark:bg-slate-900 px-2 py-0.5 rounded mt-1 inline-block">${escapeHtml(e.note)}</div>` : ''}
                          <div class="flex items-center flex-wrap gap-1.5 mt-1.5">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full" style="background:${usr.bg};color:${usr.color}">صرف: ${escapeHtml(usr.name)}</span>
                            ${isDirect ? `<span class="text-[10px] font-semibold bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 px-2 py-0.5 rounded-full">💵 خصم من الراتب</span>` : (bud ? `<span class="text-[10px] font-semibold bg-brand-50 dark:bg-brand-900/40 text-brand-700 dark:text-teal-300 px-2 py-0.5 rounded-full">${escapeHtml(bud.name)}</span>` : '')}
                            ${e.time ? `<span class="text-[10px] text-slate-400">${escapeHtml(e.time)}</span>` : ''}
                          </div>
                        </div>
                      </div>
                      <div class="flex flex-col items-end gap-1.5 shrink-0">
                        <div class="text-sm font-extrabold text-slate-900 dark:text-white">${fmt(e.amount)} <span class="text-[10px] text-slate-400">ج</span></div>
                        <div class="flex items-center gap-1">
                          <button type="button" data-edit-exp="${escapeHtml(e.id)}" class="p-1.5 rounded-lg ${isOwner ? 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-200 hover:text-brand-700' : 'bg-slate-50 dark:bg-slate-900 text-slate-300 dark:text-slate-600'}" title="${isOwner ? 'تعديل' : 'خاص بالطرف الآخر'}">
                            <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                          </button>
                          <button type="button" data-del-exp="${escapeHtml(e.id)}" class="p-1.5 rounded-lg ${isOwner ? 'bg-rose-50 dark:bg-rose-950/50 text-rose-600 dark:text-rose-400 hover:bg-rose-100' : 'bg-slate-50 dark:bg-slate-900 text-slate-300 dark:text-slate-600'}" title="${isOwner ? 'حذف' : 'خاص بالطرف الآخر'}">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                          </button>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </section>
          `;
        }).join('')}
      `;

      document.getElementById('btnJumpBasket').addEventListener('click', () => { activeTab = 'basket'; renderAll(); });
      const searchEl = document.getElementById('expSearchInput');
      searchEl.addEventListener('input', ev => {
        expenseFilter.search = ev.target.value;
        renderAll();
        const newEl = document.getElementById('expSearchInput');
        if (newEl) { newEl.focus(); newEl.setSelectionRange(newEl.value.length, newEl.value.length); }
      });
      container.querySelectorAll('.ufilter-btn').forEach(btn => {
        btn.addEventListener('click', () => { expenseFilter.user = btn.dataset.ufilter; renderAll(); });
      });
      document.getElementById('expCatFilter').addEventListener('change', ev => { expenseFilter.catId = ev.target.value; renderAll(); });
      document.getElementById('expBudFilter').addEventListener('change', ev => { expenseFilter.budgetId = ev.target.value; renderAll(); });

      const emptyBtn = document.getElementById('btnEmptyAddExp');
      if (emptyBtn) emptyBtn.addEventListener('click', () => openExpenseModal());

      container.querySelectorAll('[data-edit-exp]').forEach(btn => {
        btn.addEventListener('click', () => {
          const exp = all.find(x => x.id === btn.dataset.editExp);
          if (!exp) return;
          if (exp.userId !== state.activeUserId) { showToast(`هذا المصروف أضافه ${state.users[exp.userId].name}`, 'warn'); return; }
          openExpenseModal(exp);
        });
      });

      container.querySelectorAll('[data-del-exp]').forEach(btn => {
        btn.addEventListener('click', () => {
          const exp = all.find(x => x.id === btn.dataset.delExp);
          if (!exp) return;
          if (exp.userId !== state.activeUserId) { showToast(`لا يمكن حذف مصروف أضافه ${state.users[exp.userId].name}`, 'warn'); return; }
          openConfirmModal(`حذف "${exp.itemName}" (${fmt(exp.amount)} ج)؟`, () => {
            month.expenses = month.expenses.filter(x => x.id !== exp.id);
            state.deletedIds.push(exp.id);
            logActivity(`حذف مصروف "${exp.itemName}" (${fmt(exp.amount)} ج)`);
            saveState();
            renderAll();
            showToast('تم حذف المصروف');
          });
        });
      });
    }

    function copyTextSafe(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      else fallbackCopy(text);
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }

    function exportCurrentMonthCsv() {
      const month = getCurrentMonth();
      const rows = [['التاريخ', 'الوقت', 'الصنف', 'الفئة', 'التصنيف الفرعي', 'بند الميزانية', 'المبلغ (ج)', 'المستخدم', 'ملاحظات']];
      (month.expenses || []).forEach(e => {
        const cat = getCatById(e.catId);
        const budName = e.budgetId === DIRECT_SALARY_ID ? 'مصروفات أخرى (من الراتب)' : ((month.budgets || []).find(b => b.id === e.budgetId)?.name || '');
        const usr = state.users[e.userId] || state.users.mahmoud;
        rows.push([e.date, e.time || '', e.itemName, cat.name, e.subName || '', budName, e.amount, usr.name, e.note || '']);
      });
      const csv = '\uFEFF' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `مصروفات_${month.key}.csv`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('تم تحميل ملف Excel (CSV) بنجاح');
    }

          ${msgs.length === 0 ? `<div class="text-center py-8 text-xs text-slate-400">ابدأ المحادثة بأول رسالة بينكما 💬</div>` : msgs.map(m => {
            const isMe = m.userId === state.activeUserId;
            const usr = state.users[m.userId] || state.users.mahmoud;
            return `
              <div class="flex ${isMe ? 'justify-start' : 'justify-end'}">
                <div class="max-w-[82%] rounded-2xl px-3 py-2 text-xs shadow-sm ${isMe ? 'bg-brand-700 text-white rounded-tr-sm' : 'bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 rounded-tl-sm'}">
                  <div class="text-[10px] font-extrabold ${isMe ? 'text-teal-200' : ''}" style="${!isMe ? ('color:' + usr.color) : ''}">${escapeHtml(usr.name)}</div>
                  <div class="mt-0.5 leading-relaxed font-semibold">${escapeHtml(m.text)}</div>
                  <div class="text-[9px] mt-1 text-left ${isMe ? 'text-teal-200/80' : 'text-slate-400'}">${escapeHtml(m.time || '')}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="flex gap-1.5 overflow-x-auto no-scrollbar mb-2">
          ${quickReplies.map(r => `<button type="button" data-qreply="${escapeHtml(r)}" class="qreply-btn shrink-0 px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-700 text-[11px] font-bold text-slate-700 dark:text-slate-200">${r}</button>`).join('')}
        </div>

        <div class="flex gap-2">
          <input id="chatTextInput" type="text" placeholder="اكتب رسالتك هنا..." class="flex-1 px-3 py-2.5 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl font-bold focus:outline-none focus:border-brand-600" />
          <button type="button" id="btnSendChat" class="px-4 py-2.5 rounded-xl bg-brand-700 text-white text-xs font-extrabold shrink-0">إرسال</button>
        </div>
      `);

      const box = document.getElementById('chatMessagesBox');
      if (box) box.scrollTop = box.scrollHeight;

      document.getElementById('closeChatModal').addEventListener('click', () => { closeModal(); renderAll(); });

      function sendChatMsg(text) {
        const clean = (text || '').trim();
        if (!clean) return;
        const nowTime = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        state.chatMessages.push({
          id: 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
          text: clean,
          userId: state.activeUserId,
          ts: Date.now(),
          time: nowTime
        });
        state.chatLastRead[state.activeUserId] = Date.now();
        saveState();
        openMiniChatModal();
      }

      document.getElementById('btnSendChat').addEventListener('click', () => sendChatMsg(document.getElementById('chatTextInput').value));
      document.getElementById('chatTextInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendChatMsg(e.target.value); });
      document.querySelectorAll('.qreply-btn').forEach(btn => {
        btn.addEventListener('click', () => sendChatMsg(btn.dataset.qreply));
      });
    }

    // --- UPGRADED DEBT MODAL (Urgent / Deferred / Installment + Due Date + "إضافة للتقسيم") ---

      const items = state.debt.items || [];
      const sum = calcDebtTotals();
      const typeLabels = { urgent: '🔴 دين عاجل', deferred: '🟡 دين آجل', installment: '🔵 قسط شهري' };

      showModal(`
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-base font-extrabold text-slate-900 dark:text-white">إدارة الديون والأقساط</h3>
          <button type="button" id="closeDebtModal" class="p-1.5 rounded-full bg-slate-100 dark:bg-slate-700"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>

        <div class="grid grid-cols-3 gap-2 mb-3 text-center">
          <div class="p-2 rounded-xl bg-slate-50 dark:bg-slate-900"><div class="text-[10px] text-slate-500">الإجمالي</div><div class="text-sm font-extrabold">${fmt(sum.total)}</div></div>
          <div class="p-2 rounded-xl bg-emerald-50 dark:bg-emerald-950/40"><div class="text-[10px] text-emerald-700 dark:text-emerald-300">المسدد</div><div class="text-sm font-extrabold text-emerald-700 dark:text-emerald-300">${fmt(sum.paid)}</div></div>
          <div class="p-2 rounded-xl bg-rose-50 dark:bg-rose-950/40"><div class="text-[10px] text-rose-700 dark:text-rose-300">المتبقي</div><div class="text-sm font-extrabold text-rose-700 dark:text-rose-300">${fmt(sum.remaining)}</div></div>
        </div>

        <!-- Add New Debt Form -->
        <details class="mb-3 bg-slate-50 dark:bg-slate-900/60 p-3 rounded-xl border border-slate-200 dark:border-slate-700">
          <summary class="text-xs font-extrabold text-brand-700 dark:text-teal-300 cursor-pointer">+ إضافة دين أو قسط جديد</summary>
          <div class="mt-2.5 space-y-2">
            <input id="newDebtName" type="text" placeholder="اسم الدين / الجهة (مثال: سلفة، قسط موبايل، كارت...)" class="w-full px-3 py-2 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl font-bold" />
            <div class="grid grid-cols-2 gap-2">
              <select id="newDebtType" class="px-2.5 py-2 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl font-bold">
                <option value="urgent">🔴 دين عاجل</option>
                <option value="deferred">🟡 دين آجل</option>
                <option value="installment">🔵 قسط شهري</option>
              </select>
              <input id="newDebtTotal" type="number" inputmode="decimal" placeholder="إجمالي المبلغ (ج)" class="px-3 py-2 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl font-bold" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] text-slate-500 mb-0.5">تاريخ الاستحقاق</label>
                <input id="newDebtDue" type="date" class="w-full px-2.5 py-1.5 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl font-bold" />
              </div>
              <div>
                <label class="block text-[10px] text-slate-500 mb-0.5">قيمة القسط الشهري (اختياري)</label>
                <input id="newDebtInst" type="number" inputmode="decimal" placeholder="0" class="w-full px-2.5 py-1.5 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl font-bold" />
              </div>
            </div>
            <button type="button" id="btnAddDebtItem" class="w-full py-2 rounded-xl bg-brand-700 text-white text-xs font-extrabold">حفظ الدين</button>
          </div>
        </details>

        <!-- List of Debts -->
        <div class="space-y-2.5">
          ${items.length === 0 ? `<div class="text-center py-6 text-xs text-slate-400">الحمد لله لا توجد ديون مسجلة 🎉</div>` : items.map(d => {
            const rem = Math.max(0, (Number(d.total) || 0) - (Number(d.paid) || 0));
            return `
              <div class="p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 space-y-2">
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <div class="text-xs font-extrabold text-slate-800 dark:text-slate-100">${escapeHtml(d.name)}</div>
                    <div class="flex items-center flex-wrap gap-1.5 mt-1 text-[10px] font-bold">
                      <span class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-700">${typeLabels[d.type] || 'دين'}</span>
                      ${d.dueDate ? `<span class="text-rose-600 dark:text-rose-400">📅 استحقاق: ${escapeHtml(d.dueDate)}</span>` : ''}
                      ${d.monthlyInstallment > 0 ? `<span class="text-sky-700 dark:text-sky-300">قسط: ${fmt(d.monthlyInstallment)} ج</span>` : ''}
                    </div>
                  </div>
                  <div class="text-left shrink-0">
                    <div class="text-sm font-black text-rose-600 dark:text-rose-400">${fmt(rem)} ج</div>
                    <div class="text-[10px] text-slate-400">من ${fmt(d.total)} ج</div>
                  </div>
                </div>
                <div class="grid grid-cols-3 gap-1.5 pt-2 border-t border-slate-100 dark:border-slate-700">
                  <button type="button" data-debt-to-budget="${escapeHtml(d.id)}" class="py-1.5 rounded-lg bg-amber-50 dark:bg-amber-950/50 text-amber-800 dark:text-amber-300 text-[10px] font-extrabold">+ للتقسيم</button>

                  <button type="button" data-debt-del="${escapeHtml(d.id)}" class="py-1.5 rounded-lg bg-rose-50 dark:bg-rose-950/50 text-rose-600 text-[10px] font-extrabold">حذف</button>

              </div>
            `;
          }).join('')}
