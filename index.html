    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

      color: #0f172a;
      margin: 0;

    html.dark body { background: #020617; color: #f1f5f9; }
    .app-shell {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: #f8fafc;
      position: relative;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.16);
      padding-bottom: 92px;
    }
    html.dark .app-shell { background: #0f172a; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
    @media (max-width: 480px) {
      body { background: #f8fafc; }
      html.dark body { background: #0f172a; }
      .app-shell { max-width: 100%; box-shadow: none; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      border-top: 1px solid #e2e8f0;
      z-index: 40;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    html.dark .bottom-nav { background: rgba(15, 23, 42, 0.96); border-top-color: #1e293b; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 60;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-sheet {
      width: 100%;
      max-width: 480px;
      max-height: 92vh;
      background: #ffffff;
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      overflow-y: auto;
      animation: slideUp 0.22s ease-out;
    }
    html.dark .modal-sheet { background: #1e293b; color: #f1f5f9; }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0.7; }
      to { transform: translateY(0); opacity: 1; }
    }
    .toast {
      position: fixed;
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      max-width: 92%;
      animation: fadeDown 0.2s ease-out;
    }
    @keyframes fadeDown {
      from { transform: translate(-50%, -12px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-shake { animation: shake 0.35s ease-in-out; }
    .login-screen {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: linear-gradient(160deg, #0f766e 0%, #115e59 42%, #0f172a 100%);
      color: #ffffff;
      position: relative;
      z-index: 55;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 20px 24px;
    }
    .pin-key {
      height: 56px;
      border-radius: 16px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.16);
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, background 0.15s;
    }
    .pin-key:active { transform: scale(0.94); background: rgba(255,255,255,0.28); }

    const STORAGE_KEY = 'baytna_family_budget_v1';

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.months && parsed.users) {
            // Upgrade old saves with new defaults (PINs 2006 / 2109, Firebase URL, shoppingList, coupleNote, deletedIds)
            if (!parsed.sync) parsed.sync = { firebaseUrl: 'https://bakry-5fb50-default-rtdb.firebaseio.com', lastSyncAt: '' };
            else if (!parsed.sync.firebaseUrl) parsed.sync.firebaseUrl = 'https://bakry-5fb50-default-rtdb.firebaseio.com';
            if (parsed.users.mahmoud && !parsed.users.mahmoud.pin) parsed.users.mahmoud.pin = '2006';
            if (parsed.users.nora && !parsed.users.nora.pin) parsed.users.nora.pin = '2109';
            if (!Array.isArray(parsed.shoppingList)) parsed.shoppingList = [];
            if (!Array.isArray(parsed.deletedIds)) parsed.deletedIds = [];
            if (!parsed.coupleNote) parsed.coupleNote = { text: '', userId: 'nora', updatedAt: '' };
            if (typeof parsed.darkMode !== 'boolean') parsed.darkMode = false;
            return parsed;
          }
        }
      } catch (e) {}
      return buildInitialState();
    }

    function saveState(skipCloud = false) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
      if (!skipCloud && state.sync && state.sync.firebaseUrl) {
        pushToFirebase();
      }
    }

        .replace(/&/g, '&amp;')

      el.className = `toast ${bg} text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 text-center`;

    function showLoginScreen(prefUid = null) {
      isAuthenticated = false;

      loginPinBuffer = '';
      document.getElementById('appRoot').classList.add('hidden');

      document.getElementById('loginAvatarM').textContent = state.users.mahmoud.avatar;

      document.getElementById('loginAvatarN').textContent = state.users.nora.avatar;
      updateLoginUi();
      if (window.lucide) lucide.createIcons();
    }

    function updateLoginUi() {
      document.querySelectorAll('.login-user-card').forEach(btn => {
        const uid = btn.dataset.loginUid;
        const active = uid === loginSelectedUid;
        btn.classList.toggle('bg-white/20', active);
        btn.classList.toggle('bg-white/5', !active);
        btn.classList.toggle('border-sky-300', active && uid === 'mahmoud');
        btn.classList.toggle('border-pink-300', active && uid === 'nora');
        btn.classList.toggle('border-white/15', !active);
        btn.classList.toggle('scale-[1.02]', active);
      });
      const targetName = state.users[loginSelectedUid].name;
      document.getElementById('loginPinHint').textContent = `أدخل الرقم السري لحساب ${targetName} (4 أرقام)`;
      const dots = document.querySelectorAll('#loginPinDots .pin-dot');
      dots.forEach((d, idx) => {
        const filled = idx < loginPinBuffer.length;
        d.classList.toggle('bg-white', filled);
        d.classList.toggle('scale-110', filled);
        d.classList.toggle('border-white', filled);
      });
    }

    function handleLoginDigit(digit) {
      if (loginPinBuffer.length >= 4) return;
      document.getElementById('loginErrorMsg').textContent = '';
      loginPinBuffer += digit;
      updateLoginUi();
      if (loginPinBuffer.length === 4) {
        const target = state.users[loginSelectedUid];
        const expectedPin = target.pin || (loginSelectedUid === 'mahmoud' ? '2006' : '2109');
        if (loginPinBuffer === expectedPin) {
          state.activeUserId = loginSelectedUid;
          isAuthenticated = true;
          const remember = document.getElementById('rememberLoginCheck').checked;
          try {
            if (remember) localStorage.setItem(AUTH_KEY, JSON.stringify({ uid: loginSelectedUid, ts: Date.now() }));
            else localStorage.removeItem(AUTH_KEY);
          } catch (e) {}
          saveState(true);
          document.getElementById('loginScreen').classList.add('hidden');
          document.getElementById('appRoot').classList.remove('hidden');
          renderAll();
          showToast(`أهلاً بك يا ${target.name} 🏠`);
          if (state.sync && state.sync.firebaseUrl) {
            pullFromFirebase(false);
            startCloudAutoSync();
          }
        } else {
          const dotsWrap = document.getElementById('loginPinDots');
          dotsWrap.classList.remove('animate-shake');
          void dotsWrap.offsetWidth;
          dotsWrap.classList.add('animate-shake');
          document.getElementById('loginErrorMsg').textContent = 'الرقم السري غير صحيح — حاول مرة أخرى';
          setTimeout(() => {
            loginPinBuffer = '';
            updateLoginUi();
          }, 420);
        }
      }
    }

    function lockAndLogout() {
      try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
      if (window._cloudSyncInterval) clearInterval(window._cloudSyncInterval);
      showLoginScreen(state.activeUserId);
    }

    // =========================================================================
    // 4. CLOUD SYNC (FIREBASE REALTIME DB) & WHATSAPP MERGE SYNC
    // =========================================================================
    function normalizeFirebaseUrl(raw) {
      let u = (raw || '').trim();
      if (!u) return '';
      if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      u = u.replace(/\/baytna_budget\.json$/i, '').replace(/\/+$/, '');
      return u;
    }

    function describeFirebaseError(err) {
      const msg = String(err && err.message ? err.message : err || '');
      if (msg.includes('401') || msg.includes('403')) {
        return {
          short: 'مقفول من Firebase Rules (401)',
          detail: 'افتح Firebase ← Realtime Database ← Rules وغيّر read و write إلى true ثم اضغط Publish'
        };
      }
      if (msg.includes('404')) {
        return {
          short: 'الرابط غير موجود (404)',
          detail: 'تأكد من إنشاء Realtime Database ونسخ الرابط الصحيح من Firebase'
        };
      }
      return {
        short: 'تعذر الاتصال (تأكد من الإنترنت/Rules)',
        detail: 'تعذر الاتصال بـ Firebase حالياً — تأكد من الإنترنت وافتح الملف من المتصفح المباشر على الموبايل'
      };
    }

    async function pushToFirebase() {
      const url = normalizeFirebaseUrl(state.sync.firebaseUrl);
      if (!url || !url.startsWith('https://')) return;
      try {
        updateSyncIndicator('syncing', 'جاري الحفظ السحابي...');
        const payload = { ...state };
        delete payload.activeUserId;
        delete payload.darkMode;
        const res = await fetch(url + '/baytna_budget.json', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        state.sync.lastSyncAt = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        updateSyncIndicator('ok', 'متزامن سحابياً ' + state.sync.lastSyncAt);
      } catch (e) {
        const info = describeFirebaseError(e);
        updateSyncIndicator('err', info.short);
      }
    }

    async function pullFromFirebase(showMsg = false) {
      const url = normalizeFirebaseUrl(state.sync.firebaseUrl);
      if (!url || !url.startsWith('https://')) return;
      try {
        updateSyncIndicator('syncing', 'جاري تحديث البيانات...');
        const res = await fetch(url + '/baytna_budget.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const remote = await res.json();
        if (remote && remote.months) {
          const myUserId = state.activeUserId;
          const myUrl = url;
          const myDark = state.darkMode;
          mergeRemoteState(remote);
          state.activeUserId = myUserId;
          state.sync.firebaseUrl = myUrl;
          state.darkMode = myDark;
          state.sync.lastSyncAt = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
          saveState(true);
          if (isAuthenticated) renderAll();
          updateSyncIndicator('ok', 'متزامن سحابياً ' + state.sync.lastSyncAt);
          if (showMsg) showToast('تم التحديث والمزامنة السحابية بنجاح');
        } else {
          await pushToFirebase();
          if (showMsg) showToast('تم رفع بياناتك إلى Firebase لأول مرة بنجاح');
        }
      } catch (e) {
        const info = describeFirebaseError(e);
        updateSyncIndicator('err', info.short);
        if (showMsg) showToast(info.detail, 'error');
      }
    }

    function startCloudAutoSync() {
      if (window._cloudSyncInterval) clearInterval(window._cloudSyncInterval);
      if (state.sync && normalizeFirebaseUrl(state.sync.firebaseUrl)) {
        window._cloudSyncInterval = setInterval(() => {
          if (!document.hidden && isAuthenticated) pullFromFirebase(false);
        }, 15000);
      }
    }

    function mergeRemoteState(remote) {
      if (!remote || !remote.months) return;
      // Union deletedIds so deleted items stay deleted
      const delSet = new Set([...(state.deletedIds || []), ...(remote.deletedIds || [])]);
      state.deletedIds = Array.from(delSet).slice(-300);

      Object.keys(remote.months).forEach(mKey => {
        if (!state.months[mKey]) {
          state.months[mKey] = remote.months[mKey];
        } else {
          const loc = state.months[mKey];
          const rem = remote.months[mKey];
          const incMap = new Map();
          (loc.incomes || []).forEach(x => { if (!delSet.has(x.id)) incMap.set(x.id, x); });
          (rem.incomes || []).forEach(x => { if (!delSet.has(x.id)) incMap.set(x.id, x); });
          loc.incomes = Array.from(incMap.values());

          const budMap = new Map();
          (loc.budgets || []).forEach(x => { if (!delSet.has(x.id)) budMap.set(x.id, x); });
          (rem.budgets || []).forEach(x => { if (!delSet.has(x.id)) budMap.set(x.id, x); });
          loc.budgets = Array.from(budMap.values());

          const expMap = new Map();
          (loc.expenses || []).forEach(x => { if (!delSet.has(x.id)) expMap.set(x.id, x); });
          (rem.expenses || []).forEach(x => { if (!delSet.has(x.id)) expMap.set(x.id, x); });
          loc.expenses = Array.from(expMap.values()).sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
        }
      });

      // Merge shopping list
      const shopMap = new Map();
      (state.shoppingList || []).forEach(x => { if (!delSet.has(x.id)) shopMap.set(x.id, x); });
      (remote.shoppingList || []).forEach(x => { if (!delSet.has(x.id)) shopMap.set(x.id, x); });
      state.shoppingList = Array.from(shopMap.values());

      if (remote.coupleNote && remote.coupleNote.updatedAt && (!state.coupleNote || (remote.coupleNote.updatedAt > (state.coupleNote.updatedAt || '')))) {
        state.coupleNote = remote.coupleNote;
      }
      if (remote.debt) state.debt = remote.debt;
      if (remote.activityLog) {
        const actMap = new Map();
        [...(remote.activityLog || []), ...(state.activityLog || [])].forEach(a => actMap.set(a.id, a));
        state.activityLog = Array.from(actMap.values()).slice(0, 50);
      }
    }

    function updateSyncIndicator(status, text) {
      const dot = document.getElementById('syncStatusDot');
      const txt = document.getElementById('syncStatusText');
      if (!dot || !txt) return;
      txt.textContent = text;
      dot.className = 'w-2 h-2 rounded-full inline-block ' + (
        status === 'ok' ? 'bg-emerald-300' :
        status === 'syncing' ? 'bg-amber-300 animate-pulse' :
        status === 'err' ? 'bg-rose-400' : 'bg-teal-200'
      );
    }

    // =========================================================================
    // 5. COMPUTATIONS & SMART INSIGHTS
    // =========================================================================
    function calcMonthSummary(month) {
      const totalIncome = (month.incomes || []).reduce((s, i) => s + (Number(i.amount) || 0), 0);
      const totalPlanned = (month.budgets || []).reduce((s, b) => s + (Number(b.planned) || 0), 0);
      const unallocated = totalIncome - totalPlanned;

      const expenses = month.expenses || [];
      const totalSpent = expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
      const remaining = totalIncome - totalSpent;

      const byUser = { mahmoud: { total: 0, count: 0 }, nora: { total: 0, count: 0 } };
      const byBudget = {};
      const byCat = {};

      expenses.forEach(e => {
        const amt = Number(e.amount) || 0;
        const uid = e.userId === 'nora' ? 'nora' : 'mahmoud';
        byUser[uid].total += amt;
        byUser[uid].count += 1;
        if (e.budgetId) byBudget[e.budgetId] = (byBudget[e.budgetId] || 0) + amt;
        byCat[e.catId] = (byCat[e.catId] || 0) + amt;
      });

      const fixedPlanned = (month.budgets || []).filter(b => b.type === 'fixed').reduce((s, b) => s + (Number(b.planned) || 0), 0);
      const varPlanned = (month.budgets || []).filter(b => b.type === 'variable').reduce((s, b) => s + (Number(b.planned) || 0), 0);

      // Daily safe spend calculation
      const [yStr, mStr] = (month.key || '2026-11').split('-');
      const daysInMonth = new Date(Number(yStr), Number(mStr), 0).getDate() || 30;
      const now = new Date();
      const isSameMonth = now.getFullYear() === Number(yStr) && (now.getMonth() + 1) === Number(mStr);
      const daysLeft = isSameMonth ? Math.max(1, daysInMonth - now.getDate() + 1) : daysInMonth;
      const dailySafe = remaining > 0 ? Math.floor(remaining / daysLeft) : 0;

      // Smart budget alerts (>= 80% or exceeded)
      const alerts = [];
      (month.budgets || []).forEach(b => {
        const spent = byBudget[b.id] || 0;
        const planned = Number(b.planned) || 0;
        if (planned > 0 && spent >= planned * 0.8) {
          alerts.push({ name: b.name, spent, planned, pct: Math.round((spent / planned) * 100), over: spent > planned });
        }
      });

      return { totalIncome, totalPlanned, unallocated, totalSpent, remaining, byUser, byBudget, byCat, fixedPlanned, varPlanned, daysLeft, dailySafe, alerts };
    }

    function copyTextSafe(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }

    function exportCurrentMonthCsv() {
      const month = getCurrentMonth();
      const rows = [['التاريخ', 'الوقت', 'الصنف', 'الفئة', 'التصنيف الفرعي', 'بند الميزانية', 'المبلغ (ج)', 'المستخدم', 'ملاحظات']];
      (month.expenses || []).forEach(e => {
        const cat = getCatById(e.catId);
        const bud = (month.budgets || []).find(b => b.id === e.budgetId);
        const usr = state.users[e.userId] || state.users.mahmoud;
        rows.push([e.date, e.time || '', e.itemName, cat.name, e.subName || '', bud ? bud.name : '', e.amount, usr.name, e.note || '']);
      });
      const csv = '\uFEFF' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `مصروفات_${month.key}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('تم تحميل ملف Excel (CSV) بنجاح');
    }

    // --- SHARED SHOPPING LIST MODAL ("طلبات البيت" — مثل النوتس المشتركة!) ---
    function openShoppingListModal() {
      const list = state.shoppingList || [];
      const pending = list.filter(x => !x.done);
      const done = list.filter(x => x.done);

      showModal(`
        <div class="flex items-center justify-between mb-3">
          <div>
            <h3 class="text-base font-extrabold text-slate-900 dark:text-white flex items-center gap-1.5">🧺 قائمة طلبات البيت المشتركة</h3>
            <p class="text-[11px] text-slate-500 dark:text-slate-400">اكتب الطلبات هنا — وعند الشراء اضغط "تم الشراء" لتتحول لمصروف فوراً</p>
          </div>
          <button type="button" id="closeShopModal" class="p-1.5 rounded-full bg-slate-100 dark:bg-slate-700"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>

        <!-- Add Shopping Item -->
        <div class="bg-slate-50 dark:bg-slate-900/60 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 space-y-2 mb-3">
          <div class="flex gap-1.5">
            <input id="shopItemName" type="text" placeholder="اكتب الطلب (مثال: كيلو بانيه، ٦ ورك، لبن...)" class="flex-1 px-3 py-2 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl font-bold" />
            <button type="button" id="btnAddShopItem" class="px-3.5 py-2 rounded-xl bg-brand-700 text-white text-xs font-extrabold shrink-0">إضافة</button>
          </div>
          <input id="shopItemQty" type="text" placeholder="ملاحظة / كمية (مثال: كل نص لوحده، من عند عكوش...)" class="w-full px-3 py-1.5 text-[11px] bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg" />
        </div>

        <!-- Pending Items -->
        <div class="space-y-2 mb-3">
          <div class="text-xs font-extrabold text-slate-600 dark:text-slate-300">مطلوب شراؤه (${pending.length})</div>
          ${pending.length === 0 ? `
            <div class="text-center py-4 text-xs text-slate-400 bg-slate-50 dark:bg-slate-900/40 rounded-xl border border-dashed border-slate-200 dark:border-slate-700">لا توجد طلبات حالياً — أضف أي صنف من فوق</div>
          ` : pending.map(item => {
            const usr = state.users[item.userId] || state.users.nora;
            return `
              <div class="p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-between gap-2">
                <div class="min-w-0">
                  <div class="text-xs font-extrabold text-slate-800 dark:text-slate-100">${escapeHtml(item.name)}</div>
                  ${item.note ? `<div class="text-[10px] text-slate-500 dark:text-slate-400">${escapeHtml(item.note)}</div>` : ''}
                  <span class="text-[10px] font-bold" style="color:${usr.color}">طلبه: ${escapeHtml(usr.name)}</span>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  <button type="button" data-buy-shop="${escapeHtml(item.id)}" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 text-white text-[11px] font-bold">تم الشراء ✓</button>
                  <button type="button" data-del-shop="${escapeHtml(item.id)}" class="p-1.5 rounded-lg bg-rose-50 dark:bg-rose-950/50 text-rose-600"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        ${done.length > 0 ? `
          <div class="space-y-1.5 pt-2 border-t border-slate-100 dark:border-slate-700">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-slate-400">تم شراؤه (${done.length})</span>
              <button type="button" id="btnClearDoneShop" class="text-[11px] font-bold text-rose-600">مسح المكتمل</button>
            </div>
            ${done.map(item => `
              <div class="px-2.5 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-900/40 flex items-center justify-between text-xs text-slate-400 line-through">
                <span>${escapeHtml(item.name)}</span>
                <span>${item.paidAmount ? fmt(item.paidAmount) + ' ج' : '✓'}</span>
              </div>
            `).join('')}
          </div>
        ` : ''}
      `);

      document.getElementById('closeShopModal').addEventListener('click', closeModal);
      document.getElementById('btnAddShopItem').addEventListener('click', () => {
        const name = document.getElementById('shopItemName').value.trim();
        const note = document.getElementById('shopItemQty').value.trim();
        if (!name) { showToast('اكتب اسم الصنف المطلوب', 'error'); return; }
        state.shoppingList.unshift({ id: 'shop_' + Date.now(), name, note, done: false, userId: state.activeUserId });
        logActivity(`أضاف "${name}" إلى قائمة طلبات البيت`);
        saveState();
        renderAll();
        openShoppingListModal();
      });

      document.querySelectorAll('[data-del-shop]').forEach(btn => {
        btn.addEventListener('click', () => {
          const sid = btn.dataset.delShop;
          state.shoppingList = state.shoppingList.filter(x => x.id !== sid);
          state.deletedIds.push(sid);
          saveState();
          renderAll();
          openShoppingListModal();
        });
      });

      document.querySelectorAll('[data-buy-shop]').forEach(btn => {
        btn.addEventListener('click', () => {
          const item = state.shoppingList.find(x => x.id === btn.dataset.buyShop);
          if (!item) return;
          openBuyShopItemModal(item);
        });
      });

      const clearBtn = document.getElementById('btnClearDoneShop');
      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          state.shoppingList.filter(x => x.done).forEach(x => state.deletedIds.push(x.id));
          state.shoppingList = state.shoppingList.filter(x => !x.done);
          saveState();
          renderAll();
          openShoppingListModal();
        });
      }
    }

    function openBuyShopItemModal(shopItem) {
      const month = getCurrentMonth();
      const homeBud = (month.budgets || []).find(b => b.name.includes('البيت')) || (month.budgets || [])[0];
      showModal(`
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-base font-extrabold text-slate-900 dark:text-white">تأكيد شراء "${escapeHtml(shopItem.name)}"</h3>
          <button type="button" id="closeBuyModal" class="p-1.5 rounded-full bg-slate-100 dark:bg-slate-700"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <p class="text-xs text-slate-500 dark:text-slate-400 mb-3">أدخل المبلغ الذي دفعته ليتم تسجيله تلقائياً في مصروفات الشهر باسم <strong>${escapeHtml(getActiveUser().name)}</strong>.</p>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">المبلغ المدفوع (جنيه)</label>
            <input id="buyShopAmount" type="number" inputmode="decimal" placeholder="0" class="w-full px-3 py-2.5 text-xl font-extrabold text-brand-700 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">يُخصم من بند الميزانية</label>
            <select id="buyShopBudget" class="w-full px-3 py-2 text-xs font-bold bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl">
              ${(month.budgets || []).map(b => `<option value="${escapeHtml(b.id)}" ${homeBud && b.id === homeBud.id ? 'selected' : ''}>${escapeHtml(b.name)}</option>`).join('')}
            </select>
          </div>
          <button type="button" id="btnConfirmBuyShop" class="w-full py-3 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">تسجيل كمصروف وإتمام الشراء ✓</button>
        </div>
      `);
      document.getElementById('closeBuyModal').addEventListener('click', openShoppingListModal);
      document.getElementById('buyShopAmount').focus();
      document.getElementById('btnConfirmBuyShop').addEventListener('click', () => {
        const amt = Number(document.getElementById('buyShopAmount').value);
        if (!amt || amt <= 0) { showToast('أدخل المبلغ المدفوع', 'error'); return; }
        const matched = FLAT_CATALOG.find(f => shopItem.name.includes(f.itemName));
        const todayStr = new Date().toISOString().slice(0, 10);
        const nowTime = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        month.expenses.unshift({
          id: 'exp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          date: month.key === todayStr.slice(0, 7) ? todayStr : (month.key + '-01'),
          time: nowTime,
          amount: amt,
          catId: matched ? matched.catId : 'pantry_spices',
          subName: matched ? matched.subName : 'طلبات البيت',
          itemName: shopItem.name,
          budgetId: document.getElementById('buyShopBudget').value,
          note: shopItem.note || 'من قائمة طلبات البيت',
          userId: state.activeUserId,
          createdAt: new Date().toISOString()
        });
        shopItem.done = true;
        shopItem.paidAmount = amt;
        logActivity(`اشترى "${shopItem.name}" من طلبات البيت بمبلغ ${fmt(amt)} ج`);
        saveState();
        renderAll();
        openShoppingListModal();
        showToast(`تم تسجيل "${shopItem.name}" (${fmt(amt)} ج) في المصروفات`);
      });
    }

    // --- COUPLE NOTE MODAL ---
    function openCoupleNoteModal() {
      showModal(`
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-base font-extrabold text-slate-900 dark:text-white">💌 رسالة / تذكير سريع</h3>
          <button type="button" id="closeNoteModal" class="p-1.5 rounded-full bg-slate-100 dark:bg-slate-700"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <textarea id="coupleNoteInput" rows="3" class="w-full p-3 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl font-bold mb-3" placeholder="اكتب رسالة أو تذكير يظهر في الصفحة الرئيسية للطرف الآخر...">${escapeHtml(state.coupleNote?.text || '')}</textarea>
        <div class="flex gap-2">
          <button type="button" id="btnSaveCoupleNote" class="flex-1 py-2.5 rounded-xl bg-brand-700 text-white text-xs font-extrabold">تثبيت الرسالة</button>
          <button type="button" id="btnClearCoupleNote" class="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-200 text-xs font-bold">مسح</button>
        </div>
      `);
      document.getElementById('closeNoteModal').addEventListener('click', closeModal);
      document.getElementById('btnSaveCoupleNote').addEventListener('click', () => {
        const txt = document.getElementById('coupleNoteInput').value.trim();
        state.coupleNote = { text: txt, userId: state.activeUserId, updatedAt: new Date().toISOString() };
        if (txt) logActivity(`ثبّت رسالة تذكير: "${txt.slice(0, 30)}"`);
        saveState();
        closeModal();
        renderAll();
        showToast('تم حفظ الرسالة');
      });
      document.getElementById('btnClearCoupleNote').addEventListener('click', () => {
        state.coupleNote = { text: '', userId: state.activeUserId, updatedAt: new Date().toISOString() };
        saveState();
        closeModal();
        renderAll();
      });
    }

    // --- ADD / EDIT EXPENSE MODAL ---
    function openExpenseModal(existingExp = null, preBudgetId = '', preCatId = '') {
      const month = getCurrentMonth();
      const usr = getActiveUser();
      const todayStr = new Date().toISOString().slice(0, 10);
      const defaultDate = existingExp ? existingExp.date : (month.key === todayStr.slice(0, 7) ? todayStr : (month.key + '-01'));

      let selectedCatId = existingExp ? existingExp.catId : (preCatId || 'poultry_meat');
      let selectedSubName = existingExp ? existingExp.subName : getCatById(selectedCatId).subcategories[0].name;
      let selectedItemName = existingExp ? existingExp.itemName : '';
      let isCustomOther = existingExp ? (selectedCatId === 'other' || !FLAT_CATALOG.some(f => f.itemName === existingExp.itemName)) : false;

      function findBudgetIdForCat(cid) {
        if (preBudgetId) return preBudgetId;
        const c = getCatById(cid);
        const match = (month.budgets || []).find(b => b.name === c.defaultBudgetName) || (month.budgets || []).find(b => b.catId === cid);
        return match ? match.id : ((month.budgets[0] && month.budgets[0].id) || '');
      }

      let selectedBudgetId = existingExp ? existingExp.budgetId : findBudgetIdForCat(selectedCatId);

      showModal(`
        <div class="flex items-center justify-between mb-3">
          <div>
            <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${existingExp ? 'تعديل مصروف' : 'تسجيل مصروف جديد'}</h3>
            <div class="text-[11px] font-bold" style="color:${usr.color}">بواسطة: ${escapeHtml(usr.name)} • ${escapeHtml(month.label)}</div>
          </div>
          <button type="button" id="closeExpModal" class="p-1.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>

        <!-- Quick Daily Favorites (1-Tap Shortcuts) -->
        ${!existingExp ? `
          <div class="mb-2.5">
            <div class="text-[10px] font-bold text-slate-400 mb-1">اختصارات سريعة متكررة:</div>
            <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
              ${QUICK_FAVORITES.map((f, i) => `<button type="button" data-qfav="${i}" class="qfav-btn shrink-0 px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-700 hover:bg-brand-100 text-[11px] font-bold text-slate-700 dark:text-slate-200">${f.label}</button>`).join('')}
            </div>
          </div>
        ` : ''}

        <!-- 1. Instant Smart Search -->
        <div class="relative mb-3">
          <i data-lucide="search" class="w-4 h-4 text-brand-600 absolute right-3 top-3"></i>
          <input id="smartItemSearch" type="text" placeholder="ابحث بسرعة: بانيه، توكتوك، فول، مولفيكس، كهرباء..." class="w-full pr-9 pl-3 py-2.5 text-xs bg-brand-50/70 dark:bg-slate-900 border border-brand-200 dark:border-slate-700 rounded-xl font-bold focus:outline-none focus:border-brand-600" />
          <div id="smartSearchResults" class="hidden absolute left-0 right-0 top-11 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl z-20 max-h-52 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-700"></div>
        </div>

        <!-- 2. Amount Input + Quick Chips -->
        <div class="mb-3">
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">المبلغ المدفوع (جنيه)</label>
          <input id="expAmountInput" type="number" inputmode="decimal" step="0.5" value="${existingExp ? existingExp.amount : ''}" placeholder="0" class="w-full px-3.5 py-2.5 text-xl font-extrabold text-brand-800 dark:text-teal-300 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:outline-none focus:border-brand-600" />
          <div class="flex gap-1.5 mt-1.5 overflow-x-auto no-scrollbar">
            ${[10, 20, 50, 100, 200, 500].map(v => `<button type="button" data-qamt="${v}" class="qamt-btn shrink-0 px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-brand-100 text-[11px] font-bold text-slate-700 dark:text-slate-200">+${v}</button>`).join('')}
          </div>
        </div>

        <!-- 3. Category Horizontal Picker -->
        <div class="mb-2.5">
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">1. اختر الفئة الرئيسية</label>
          <div id="catPicker" class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1"></div>
        </div>

        <!-- 4. Subcategory Picker -->
        <div class="mb-2.5">
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">2. التصنيف الفرعي</label>
          <div id="subPicker" class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1"></div>
        </div>

        <!-- 5. Items Picker -->
        <div class="mb-3">
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">3. اختر الصنف (أو اضغط "أخرى" للكتابة اليدوية)</label>
          <div id="itemPicker" class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto p-2 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700"></div>
        </div>

        <!-- Custom "أخرى" Manual Input -->
        <div id="customItemWrap" class="${isCustomOther ? '' : 'hidden'} mb-3">
          <label class="block text-xs font-bold text-amber-700 dark:text-amber-300 mb-1">اكتب اسم المصروف / الصنف يدوياً</label>
          <input id="customItemInput" type="text" value="${escapeHtml(selectedItemName)}" placeholder="مثال: تصليح كوتشي عمر، شحن كارت..." class="w-full px-3 py-2 text-xs bg-amber-50 dark:bg-amber-950/40 border border-amber-300 dark:border-amber-700 rounded-xl font-bold focus:outline-none focus:border-amber-600" />
        </div>

        <!-- Selected Summary Pill -->
        <div class="mb-3 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 flex items-center justify-between text-xs">
          <span class="text-slate-500 dark:text-slate-400 font-semibold">الصنف المختار:</span>
          <span id="chosenItemBadge" class="font-extrabold text-brand-800 dark:text-teal-300">${escapeHtml(selectedItemName || 'اختر صنفاً أو اكتب يدوياً')}</span>
        </div>

        <!-- 6. Budget Envelope + Date + Note -->
        <div class="grid grid-cols-2 gap-2 mb-3">
          <div>
            <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-400 mb-1">يُخصم من بند الميزانية</label>
            <select id="expBudgetSelect" class="w-full px-2.5 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl font-bold">
              ${(month.budgets || []).map(b => `<option value="${escapeHtml(b.id)}" ${b.id === selectedBudgetId ? 'selected' : ''}>${escapeHtml(b.name)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-400 mb-1">التاريخ</label>
            <input id="expDateInput" type="date" value="${escapeHtml(defaultDate)}" class="w-full px-2.5 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl font-bold" />
          </div>
        </div>

        <div class="mb-4">
          <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-400 mb-1">الكمية / ملاحظة (اختياري)</label>
          <input id="expNoteInput" type="text" value="${escapeHtml(existingExp ? (existingExp.note || '') : '')}" placeholder="مثال: كيلو كل نص لوحده، من عند عكوش..." class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl" />
        </div>

        <button type="button" id="btnSubmitExpense" class="w-full py-3 rounded-xl bg-brand-700 hover:bg-brand-800 text-white text-sm font-extrabold shadow-md active:scale-95 transition">
          ${existingExp ? 'حفظ التعديلات' : 'حفظ المصروف'}
        </button>
      `);

      document.getElementById('closeExpModal').addEventListener('click', closeModal);

      document.querySelectorAll('.qamt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const inp = document.getElementById('expAmountInput');
          inp.value = (Number(inp.value) || 0) + Number(btn.dataset.qamt);
        });
      });

      document.querySelectorAll('.qfav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const fav = QUICK_FAVORITES[Number(btn.dataset.qfav)];
          selectedCatId = fav.catId;
          selectedSubName = fav.subName;
          selectedItemName = fav.itemName;
          isCustomOther = false;
          const autoBud = findBudgetIdForCat(fav.catId);
          if (autoBud) document.getElementById('expBudgetSelect').value = autoBud;
          renderPickers();
          document.getElementById('expAmountInput').focus();
        });
      });

      function updateChosenBadge() {
        const badge = document.getElementById('chosenItemBadge');
        const customVal = document.getElementById('customItemInput').value.trim();
        badge.textContent = isCustomOther ? (customVal || 'أخرى (اكتب الاسم فوق)') : (selectedItemName || 'اختر صنفاً');
      }

      function renderPickers() {
        const catEl = document.getElementById('catPicker');
        catEl.innerHTML = CATALOG.map(c => `
          <button type="button" data-cid="${c.id}" class="cat-chip shrink-0 px-2.5 py-1.5 rounded-xl text-xs font-bold border transition flex items-center gap-1 ${c.id === selectedCatId ? 'bg-brand-700 text-white border-brand-700' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700'}">
            <span>${c.icon}</span><span>${escapeHtml(c.name)}</span>
          </button>
        `).join('');

        const curCat = getCatById(selectedCatId);
        if (!curCat.subcategories.some(s => s.name === selectedSubName)) {
          selectedSubName = curCat.subcategories[0].name;
        }
        const subEl = document.getElementById('subPicker');
        subEl.innerHTML = curCat.subcategories.map(s => `
          <button type="button" data-sname="${escapeHtml(s.name)}" class="sub-chip shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold border ${s.name === selectedSubName ? 'bg-slate-800 dark:bg-teal-600 text-white border-slate-800 dark:border-teal-600' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-200 border-slate-200 dark:border-slate-600'}">
            ${escapeHtml(s.name)}
          </button>
        `).join('');

        const curSub = curCat.subcategories.find(s => s.name === selectedSubName) || curCat.subcategories[0];
        const itemEl = document.getElementById('itemPicker');
        itemEl.innerHTML = curSub.items.map(it => {
          const isOtherBtn = it === 'أخرى';
          const active = isOtherBtn ? isCustomOther : (!isCustomOther && selectedItemName === it);
          return `
            <button type="button" data-iname="${escapeHtml(it)}" class="item-chip px-2.5 py-1.5 rounded-lg text-xs font-bold border transition ${active ? (isOtherBtn ? 'bg-amber-600 text-white border-amber-600' : 'bg-brand-600 text-white border-brand-600') : (isOtherBtn ? 'bg-amber-50 dark:bg-amber-950/50 text-amber-800 dark:text-amber-300 border-amber-300 dark:border-amber-700' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700')}">
              ${isOtherBtn ? '✏️ أخرى (كتابة يدوية)' : escapeHtml(it)}
            </button>
          `;
        }).join('');

        document.getElementById('customItemWrap').classList.toggle('hidden', !isCustomOther);
        updateChosenBadge();

        catEl.querySelectorAll('.cat-chip').forEach(b => {
          b.addEventListener('click', () => {
            selectedCatId = b.dataset.cid;
            isCustomOther = (selectedCatId === 'other');
            if (!isCustomOther) selectedItemName = '';
            const autoBud = findBudgetIdForCat(selectedCatId);
            if (autoBud) document.getElementById('expBudgetSelect').value = autoBud;
            renderPickers();
            if (isCustomOther) document.getElementById('customItemInput').focus();
          });
        });

        subEl.querySelectorAll('.sub-chip').forEach(b => {
          b.addEventListener('click', () => {
            selectedSubName = b.dataset.sname;
            renderPickers();
          });
        });

        itemEl.querySelectorAll('.item-chip').forEach(b => {
          b.addEventListener('click', () => {
            const it = b.dataset.iname;
            if (it === 'أخرى') {
              isCustomOther = true;
              renderPickers();
              document.getElementById('customItemInput').focus();
            } else {
              isCustomOther = false;
              selectedItemName = it;
              renderPickers();
            }
          });
        });
      }

      renderPickers();
      document.getElementById('customItemInput').addEventListener('input', updateChosenBadge);

      const smartInput = document.getElementById('smartItemSearch');
      const smartRes = document.getElementById('smartSearchResults');
      smartInput.addEventListener('input', () => {
        const q = smartInput.value.trim().toLowerCase();
        if (!q) { smartRes.classList.add('hidden'); return; }
        const hits = FLAT_CATALOG.filter(f =>
          f.itemName.toLowerCase().includes(q) ||
          f.subName.toLowerCase().includes(q) ||
          f.catName.toLowerCase().includes(q)
        ).slice(0, 12);

        let html = hits.map((h, i) => `
          <button type="button" data-hit="${i}" class="smart-hit w-full text-right px-3 py-2 hover:bg-brand-50 dark:hover:bg-slate-700 flex items-center justify-between gap-2">
            <div>
              <div class="text-xs font-extrabold text-slate-800 dark:text-slate-100">${h.catIcon} ${escapeHtml(h.itemName)}</div>
              <div class="text-[10px] text-slate-500 dark:text-slate-400">${escapeHtml(h.catName)} ← ${escapeHtml(h.subName)}</div>
            </div>
            <span class="text-[10px] font-bold text-brand-700 dark:text-teal-300 bg-brand-50 dark:bg-brand-900/40 px-2 py-0.5 rounded-full">اختيار</span>
          </button>
        `).join('');

        html += `
          <button type="button" id="smartUseCustom" class="w-full text-right px-3 py-2 bg-amber-50 dark:bg-amber-950/40 hover:bg-amber-100 text-xs font-extrabold text-amber-800 dark:text-amber-300">
            ✏️ إضافة "${escapeHtml(smartInput.value.trim())}" كصنف مخصص (أخرى)
          </button>
        `;
        smartRes.innerHTML = html;
        smartRes.classList.remove('hidden');

        smartRes.querySelectorAll('.smart-hit').forEach(btn => {
          btn.addEventListener('click', () => {
            const h = hits[Number(btn.dataset.hit)];
            selectedCatId = h.catId;
            selectedSubName = h.subName;
            selectedItemName = h.itemName;
            isCustomOther = false;
            const autoBud = findBudgetIdForCat(h.catId);
            if (autoBud) document.getElementById('expBudgetSelect').value = autoBud;
            smartInput.value = '';
            smartRes.classList.add('hidden');
            renderPickers();
            document.getElementById('expAmountInput').focus();
          });
        });

        document.getElementById('smartUseCustom').addEventListener('click', () => {
          selectedCatId = 'other';
          selectedSubName = 'مصروف مخصص';
          isCustomOther = true;
          selectedItemName = smartInput.value.trim();
          document.getElementById('customItemInput').value = selectedItemName;
          smartInput.value = '';
          smartRes.classList.add('hidden');
          renderPickers();
          document.getElementById('expAmountInput').focus();
        });
      });

      document.getElementById('btnSubmitExpense').addEventListener('click', () => {
        const amt = Number(document.getElementById('expAmountInput').value);
        if (!amt || amt <= 0) { showToast('أدخل مبلغاً صحيحاً أكبر من صفر', 'error'); return; }
        const finalName = isCustomOther ? document.getElementById('customItemInput').value.trim() : selectedItemName;
        if (!finalName) { showToast('اختر صنفاً أو اكتب اسم المصروف في خانة أخرى', 'error'); return; }

        const budgetId = document.getElementById('expBudgetSelect').value;
        const dateVal = document.getElementById('expDateInput').value || defaultDate;
        const noteVal = document.getElementById('expNoteInput').value.trim();
        const nowTime = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

        if (existingExp) {
          existingExp.amount = amt;
          existingExp.catId = selectedCatId;
          existingExp.subName = selectedSubName;
          existingExp.itemName = finalName;
          existingExp.budgetId = budgetId;
          existingExp.date = dateVal;
          existingExp.note = noteVal;
          logActivity(`عدّل مصروف "${finalName}" إلى ${fmt(amt)} ج`);
          showToast('تم تعديل المصروف بنجاح');
        } else {
          month.expenses.unshift({
            id: 'exp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            date: dateVal,
            time: nowTime,
            amount: amt,
            catId: selectedCatId,
            subName: selectedSubName,
            itemName: finalName,
            budgetId,
            note: noteVal,
            userId: state.activeUserId,
            createdAt: new Date().toISOString()
          });
          logActivity(`سجّل مصروف "${finalName}" بقيمة ${fmt(amt)} ج`);
          showToast(`تم تسجيل "${finalName}" (${fmt(amt)} ج)`);
        }
        saveState();
        closeModal();
        renderAll();
      });
    }

          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">الشهر</label>
            <select id="newMonthNum" class="w-full px-3 py-2 text-xs font-bold bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl">
              ${arMonths.map((m, i) => `<option value="${String(i + 1).padStart(2, '0')}" ${i === 11 ? 'selected' : ''}>${m}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">السنة</label>
            <input id="newMonthYear" type="number" value="2026" class="w-full px-3 py-2 text-xs font-bold bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl" />
          </div>
        </div>
        <label class="flex items-center gap-2 text-xs font-bold text-slate-700 dark:text-slate-300 mb-4">
          <input id="copyPrevPlan" type="checkbox" checked class="w-4 h-4 accent-brand-700" />
          <span>نسخ مصادر الدخل وأقسام الميزانية من الشهر الحالي</span>
        </label>
        <button type="button" id="btnCreateMonth" class="w-full py-2.5 rounded-xl bg-brand-700 text-white text-xs font-extrabold">إنشاء الشهر</button>
      `);
      document.getElementById('closeMonthModal').addEventListener('click', closeModal);
      document.getElementById('btnCreateMonth').addEventListener('click', () => {
        const mNum = document.getElementById('newMonthNum').value;
        const yr = document.getElementById('newMonthYear').value.trim() || '2026';
        const key = `${yr}-${mNum}`;
        if (state.months[key]) {
          state.activeMonthKey = key;
          closeModal();
          renderAll();
          showToast('هذا الشهر موجود بالفعل — تم فتحه');
          return;
        }
        const label = `${arMonths[Number(mNum) - 1]} ${yr}`;
        const cur = getCurrentMonth();
        const copy = document.getElementById('copyPrevPlan').checked;
        state.months[key] = {
          key,
          label,
          incomes: copy ? cur.incomes.map((x, i) => ({ ...x, id: `inc_${key}_${i}` })) : [],
          budgets: copy ? cur.budgets.map((x, i) => ({ ...x, id: `b_${key}_${i}` })) : createDefaultBudgetItems().budgets,
          expenses: []
        };
        state.activeMonthKey = key;
        logActivity(`أنشأ ميزانية شهر ${label}`);
        saveState();
        closeModal();
        renderAll();
        showToast(`تم إنشاء شهر ${label}`);
      });
    }

    // --- IMPORT SYNC CODE MODAL ---
    function openImportSyncModal() {
      showModal(`
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-base font-extrabold text-slate-900 dark:text-white">استيراد ودمج كود التحديث</h3>
          <button type="button" id="closeImpModal" class="p-1.5 rounded-full bg-slate-100 dark:bg-slate-700"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <p class="text-xs text-slate-500 dark:text-slate-400 mb-2">الصق الكود الذي أرسله لك الطرف الآخر على واتساب ليتم دمج مصروفاته مع مصروفاتك.</p>
        <textarea id="importCodeArea" rows="4" dir="ltr" class="w-full p-2.5 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl font-mono mb-3" placeholder="الصق الكود هنا..."></textarea>
        <button type="button" id="btnDoImport" class="w-full py-2.5 rounded-xl bg-brand-700 text-white text-xs font-extrabold">دمج وتحديث البيانات</button>
      `);
      document.getElementById('closeImpModal').addEventListener('click', closeModal);
      document.getElementById('btnDoImport').addEventListener('click', () => {
        try {
          const raw = document.getElementById('importCodeArea').value.trim();
          const parsed = JSON.parse(decodeURIComponent(escape(atob(raw))));
          if (!parsed || !parsed.months) throw new Error('invalid');
          mergeRemoteState(parsed);
          saveState();
          closeModal();
          renderAll();
          showToast('تم دمج بيانات الطرفين بنجاح');
        } catch (e) {
          showToast('الكود غير صحيح — تأكد من نسخه بالكامل', 'error');
        }
      });
    }

    // --- CONFIRM MODAL ---
    function openConfirmModal(message, onConfirm) {
      showModal(`
        <h3 class="text-sm font-extrabold text-slate-900 dark:text-white mb-2">تأكيد</h3>
        <p class="text-xs text-slate-600 dark:text-slate-300 mb-4">${escapeHtml(message)}</p>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" id="btnConfirmYes" class="py-2.5 rounded-xl bg-rose-600 text-white text-xs font-extrabold">نعم، متأكد</button>
          <button type="button" id="btnConfirmNo" class="py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-extrabold">إلغاء</button>
        </div>
      `);
      document.getElementById('btnConfirmYes').addEventListener('click', () => { closeModal(); onConfirm(); });
      document.getElementById('btnConfirmNo').addEventListener('click', closeModal);
    }

    // =========================================================================
    // 12. PWA MANIFEST INJECTION & GLOBAL EVENT BINDINGS
    // =========================================================================
    (function setupPwaManifest() {
      try {
        const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="44" fill="#0f766e"/><text x="96" y="122" font-size="96" text-anchor="middle">🏠</text></svg>`;
        const iconUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(iconSvg)));
        const manifest = {
          name: 'ميزانية بيتنا — محمود ونورا',
          short_name: 'ميزانية بيتنا',
          start_url: '.',
          display: 'standalone',
          background_color: '#f8fafc',
          theme_color: '#0f766e',
          dir: 'rtl',
          lang: 'ar',
          icons: [{ src: iconUrl, sizes: '192x192', type: 'image/svg+xml' }]
        };
        const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);
      } catch (e) {}
    })();

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window._deferredInstallPrompt = e;
    });

    // Login Screen Listeners
    document.querySelectorAll('.login-user-card').forEach(btn => {
      btn.addEventListener('click', () => {
        loginSelectedUid = btn.dataset.loginUid;
        loginPinBuffer = '';
        document.getElementById('loginErrorMsg').textContent = '';
        updateLoginUi();
      });
    });
    document.querySelectorAll('.pin-key[data-key]').forEach(btn => {
      btn.addEventListener('click', () => handleLoginDigit(btn.dataset.key));
    });
    document.getElementById('pinKeyClear').addEventListener('click', () => {
      loginPinBuffer = '';
      document.getElementById('loginErrorMsg').textContent = '';
      updateLoginUi();
    });
    document.getElementById('pinKeyBack').addEventListener('click', () => {
      loginPinBuffer = loginPinBuffer.slice(0, -1);
      updateLoginUi();
    });

    // Keyboard support on login screen
    document.addEventListener('keydown', (e) => {
      if (isAuthenticated) return;
      if (e.key >= '0' && e.key <= '9') handleLoginDigit(e.key);
      else if (e.key === 'Backspace') { loginPinBuffer = loginPinBuffer.slice(0, -1); updateLoginUi(); }
    });

    // App Shell Global Listeners
    document.getElementById('btnSwitchUser').addEventListener('click', openSwitchUserModal);
    document.getElementById('btnLockApp').addEventListener('click', lockAndLogout);
    document.getElementById('btnAddMonth').addEventListener('click', openAddMonthModal);
    document.getElementById('btnOpenAddExpense').addEventListener('click', () => openExpenseModal());
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        renderAll();
      });
    });

    // Boot Sequence: Always show Login Screen unless explicitly remembered
    applyTheme();
    (function bootApp() {
      let remembered = null;
      try {
        const raw = localStorage.getItem(AUTH_KEY);
        if (raw) remembered = JSON.parse(raw);
      } catch (e) {}
      if (remembered && remembered.uid && state.users[remembered.uid]) {
        state.activeUserId = remembered.uid;
        isAuthenticated = true;
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('appRoot').classList.remove('hidden');
        renderAll();
        if (state.sync && state.sync.firebaseUrl) {
          pullFromFirebase(false);
          startCloudAutoSync();
        }
      } else {
        showLoginScreen(state.activeUserId);
      }
    })();
  </script>
</body>
</html>
